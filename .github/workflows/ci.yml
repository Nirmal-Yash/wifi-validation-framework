name: NetForge CI
on:
  push:
    branches: [main, 'fix/**', 'agent/**']
  pull_request:
jobs:
  control-plane-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q dashboard engine db scripts tests
      - name: Validate database bootstrap
        run: python db/init_db.py
      - name: Run dependency-free control-plane smoke tests
        run: python -m unittest tests.test_stdlib_control_plane -v
