name: NetForge CI
on:
  push:
    branches: [main, 'fix/**', 'agent/**']
  pull_request:
jobs:
  unit-and-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic CI dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Validate database bootstrap
        run: python db/init_db.py
      - name: Run non-live tests
        env:
          NETFORGE_LIVE_TESTS: '0'
          NETFORGE_AUTH_DISABLED: '1'
          FLASK_TESTING: '1'
        run: python -m pytest -q -m 'not live'
