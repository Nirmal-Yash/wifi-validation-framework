name: NetRegress Linux desktop packages

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "frontend/**"
      - "dashboard/**"
      - "lib/**"
      - "alembic/**"
      - "alembic.ini"
      - "configs/**"
      - "tests/**"
      - "regression/**"
      - "scripts/netregress_desktop_backend.py"
      - "scripts/netregress_pipeline_worker.py"
      - "packaging/**"
      - "requirements.lock"
      - "requirements-desktop-build.txt"
      - "wifi_lab_reprovision_robust.sh"
      - ".github/workflows/desktop-linux.yml"
      - ".github/workflows/netregress-quality.yml"
      - ".github/workflows/linux-release-readiness.yml"
      - ".github/dependabot.yml"
      - "lib/services/release_manifest.py"
      - "scripts/netregress_release.py"
      - "docs/P33_P37_PRODUCTION_READINESS.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: netregress-desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux desktop app (.deb and AppImage) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            xvfb \
            dbus-x11

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-desktop-build.txt

      - name: Install locked application and desktop build dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-desktop-build.txt
          python -m pip check
          python -m py_compile scripts/ci_desktop_smoke.py scripts/netregress_desktop_backend.py

      - name: Build self-contained Python Runner sidecar
        run: |
          python -m PyInstaller --clean --noconfirm \
            --distpath desktop-dist \
            --workpath desktop-build \
            packaging/netregress-backend.spec
          test -x desktop-dist/netregress-backend
          file desktop-dist/netregress-backend
          # Fail before Tauri packaging if runtime-only migration imports were omitted.
          desktop-dist/netregress-backend --check-desktop-runtime

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build the React application
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.12.5 --locked

      - name: Validate Tauri icon PNG encoding
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          path = Path("src-tauri/icons/icon.png")
          payload = path.read_bytes()
          if payload[:8] != b"\x89PNG\r\n\x1a\n" or len(payload) < 33:
              raise SystemExit(f"{path} is not a valid PNG")
          offset = 8
          width = height = bit_depth = color_type = None
          saw_idat = saw_iend = False
          while offset + 12 <= len(payload):
              length = struct.unpack(">I", payload[offset:offset + 4])[0]
              kind = payload[offset + 4:offset + 8]
              end = offset + 12 + length
              if end > len(payload):
                  raise SystemExit(f"{path} contains a truncated PNG chunk")
              chunk_data = payload[offset + 8:offset + 8 + length]
              expected_crc = struct.unpack(">I", payload[offset + 8 + length:end])[0]
              actual_crc = zlib.crc32(kind + chunk_data) & 0xffffffff
              if actual_crc != expected_crc:
                  raise SystemExit(f"{path} contains an invalid {kind.decode('ascii', 'replace')} CRC")
              if kind == b"IHDR":
                  if offset != 8 or length != 13:
                      raise SystemExit(f"{path} has an invalid IHDR chunk")
                  width, height, bit_depth, color_type = struct.unpack(">IIBB", chunk_data[:10])
              elif kind == b"IDAT":
                  saw_idat = True
              elif kind == b"IEND":
                  saw_iend = True
                  if length != 0 or end != len(payload):
                      raise SystemExit(f"{path} has invalid data after IEND")
                  break
              offset = end
          if not saw_iend or not saw_idat:
              raise SystemExit(f"{path} is missing required PNG image data or IEND")
          if (width, height, bit_depth, color_type) != (64, 64, 8, 6):
              raise SystemExit(
                  f"{path} must be a 64x64 8-bit RGBA PNG; "
                  f"found {width}x{height}, bit depth {bit_depth}, color type {color_type}"
              )
          print(f"Validated {path}: {width}x{height}, 8-bit RGBA, PNG chunk CRCs valid")
          PY

      - name: Build and bundle the desktop application
        working-directory: src-tauri
        run: cargo tauri build --bundles deb,appimage --ci

      - name: Create package checksums
        run: |
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.appimage' \) \
            -print0 | sort -z | xargs -0 sha256sum > src-tauri/target/release/bundle/SHA256SUMS
          test -s src-tauri/target/release/bundle/SHA256SUMS
          sha256sum --check src-tauri/target/release/bundle/SHA256SUMS

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release-output/netregress-source.spdx.json
          artifact-name: netregress-source-sbom-${{ github.sha }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Linux package build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.appimage

      - name: Attest Linux package SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.appimage
          sbom-path: release-output/netregress-source.spdx.json

      - name: Install Debian package and exercise first-run, restart and removal lifecycle
        id: deb-lifecycle
        continue-on-error: true
        run: |
          set -euo pipefail
          SMOKE_ROOT="${RUNNER_TEMP}/netregress-desktop-smoke"
          DEB_STATE="${SMOKE_ROOT}/deb"
          mkdir -p "${SMOKE_ROOT}"
          DEB="$(find src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)"
          test -n "${DEB}"
          DEB="$(realpath "${DEB}")"
          test -f "${DEB}"
          DEB_PACKAGE="$(dpkg-deb -f "${DEB}" Package)"
          test -n "${DEB_PACKAGE}"
          sudo apt-get install -y "${DEB}"
          APP_EXECUTABLE="$(dpkg-query -L "${DEB_PACKAGE}" | awk '/^\/usr\/bin\/[^/]+$/ {print; exit}')"
          if [[ -z "${APP_EXECUTABLE}" || ! -x "${APP_EXECUTABLE}" ]]; then
            echo "Could not locate the installed NetRegress desktop executable." >&2
            dpkg-query -L "${DEB_PACKAGE}" >&2
            exit 1
          fi
          BACKEND_EXECUTABLE="$(dpkg-query -L "${DEB_PACKAGE}" | grep -E '/netregress-backend$' | head -n 1 || true)"
          if [[ -z "${BACKEND_EXECUTABLE}" || ! -x "${BACKEND_EXECUTABLE}" ]]; then
            echo "Could not locate the packaged Python backend sidecar." >&2
            dpkg-query -L "${DEB_PACKAGE}" >&2
            find /usr/lib /opt -type f -name netregress-backend -print 2>/dev/null >&2 || true
            exit 1
          fi
          python scripts/ci_desktop_smoke.py \
            --executable "${APP_EXECUTABLE}" \
            --backend-executable "${BACKEND_EXECUTABLE}" \
            --state-root "${DEB_STATE}" \
            --label deb | tee "${SMOKE_ROOT}/deb-lifecycle.json"
          sudo apt-get remove -y "${DEB_PACKAGE}"
          if dpkg-query -W -f='${Status}' "${DEB_PACKAGE}" 2>/dev/null | grep -q "install ok installed"; then
            echo "Debian package remains installed after removal." >&2
            exit 1
          fi
          DB="$(find "${DEB_STATE}/data" -type f -name test_results.db -print -quit)"
          SESSION_SECRET="$(find "${DEB_STATE}/data" -type f -name session-secret -print -quit)"
          test -s "${DB}"
          test -s "${SESSION_SECRET}"
          echo "Debian package removal retained the user database and session secret."

      - name: Exercise AppImage first-run and restart lifecycle
        id: appimage-lifecycle
        continue-on-error: true
        run: |
          set -euo pipefail
          SMOKE_ROOT="${RUNNER_TEMP}/netregress-desktop-smoke"
          APPIMAGE_STATE="${SMOKE_ROOT}/appimage"
          APPIMAGE_RESOURCES="${SMOKE_ROOT}/appimage-resources"
          mkdir -p "${APPIMAGE_STATE}" "${APPIMAGE_RESOURCES}"
          APPIMAGE="$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)"
          test -n "${APPIMAGE}"
          APPIMAGE="$(realpath "${APPIMAGE}")"
          test -x "${APPIMAGE}"
          (cd "${APPIMAGE_RESOURCES}" && "${APPIMAGE}" --appimage-extract >/dev/null)
          BACKEND_EXECUTABLE="$(find "${APPIMAGE_RESOURCES}/squashfs-root" -type f -name netregress-backend -print -quit)"
          if [[ -z "${BACKEND_EXECUTABLE}" || ! -x "${BACKEND_EXECUTABLE}" ]]; then
            echo "Could not locate the AppImage Python backend sidecar." >&2
            find "${APPIMAGE_RESOURCES}/squashfs-root" -maxdepth 8 -type f -print >&2
            exit 1
          fi
          BACKEND_EXECUTABLE="$(realpath "${BACKEND_EXECUTABLE}")"
          python scripts/ci_desktop_smoke.py \
            --executable "${APPIMAGE}" \
            --backend-executable "${BACKEND_EXECUTABLE}" \
            --state-root "${APPIMAGE_STATE}" \
            --label appimage \
            --appimage | tee "${SMOKE_ROOT}/appimage-lifecycle.json"
          rm -rf "${APPIMAGE_RESOURCES}/squashfs-root"

      - name: Summarize desktop package qualification
        if: always()
        env:
          DEB_OUTCOME: ${{ steps.deb-lifecycle.outcome }}
          APPIMAGE_OUTCOME: ${{ steps.appimage-lifecycle.outcome }}
        run: |
          {
            echo "## Linux desktop package qualification"
            echo ""
            echo "| Package | Lifecycle result |"
            echo "|---|---|"
            echo "| Debian (.deb) | ${DEB_OUTCOME} |"
            echo "| AppImage | ${APPIMAGE_OUTCOME} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${DEB_OUTCOME}" != "success" || "${APPIMAGE_OUTCOME}" != "success" ]]; then
            echo "Linux package qualification failed; see the independent lifecycle steps above." >&2
            exit 1
          fi

      - name: Upload Linux packages for qualification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netregress-linux-desktop-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.appimage
            src-tauri/target/release/bundle/SHA256SUMS
            release-output/netregress-source.spdx.json
            ${{ runner.temp }}/netregress-desktop-smoke/**
          if-no-files-found: error
          retention-days: 30
