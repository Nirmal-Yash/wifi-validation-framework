name: NetRegress Linux desktop packages

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "frontend/**"
      - "dashboard/**"
      - "lib/**"
      - "alembic/**"
      - "alembic.ini"
      - "configs/**"
      - "tests/**"
      - "regression/**"
      - "scripts/netregress_desktop_backend.py"
      - "scripts/netregress_pipeline_worker.py"
      - "packaging/**"
      - "requirements.lock"
      - "requirements-desktop-build.txt"
      - "wifi_lab_reprovision_robust.sh"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netregress-desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux desktop app (.deb and AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-desktop-build.txt

      - name: Install locked application and desktop build dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-desktop-build.txt
          python -m pip check
          python -m py_compile scripts/ci_desktop_smoke.py

      - name: Build self-contained Python Runner sidecar
        run: |
          python -m PyInstaller --clean --noconfirm \
            --distpath desktop-dist \
            --workpath desktop-build \
            packaging/netregress-backend.spec
          test -x desktop-dist/netregress-backend
          file desktop-dist/netregress-backend

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build the React application
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build and bundle the desktop application
        working-directory: src-tauri
        run: cargo tauri build --bundles deb,appimage --ci

      - name: Create package checksums
        run: |
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.appimage' \) \
            -print0 | sort -z | xargs -0 sha256sum > src-tauri/target/release/bundle/SHA256SUMS
          test -s src-tauri/target/release/bundle/SHA256SUMS

      - name: Upload Linux packages for qualification
        uses: actions/upload-artifact@v4
        with:
          name: netregress-linux-desktop-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.appimage
            src-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
