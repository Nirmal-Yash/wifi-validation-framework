name: NetRegress Linux release readiness

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: netregress-release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-readiness:
    name: Verify exact-commit CI and prepare certification packet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require hosted CI and package qualification on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          repository = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["GITHUB_SHA"]
          workflows = ("netregress-quality.yml", "desktop-linux.yml")
          for workflow in workflows:
              endpoint = f"repos/{repository}/actions/workflows/{workflow}/runs"
              result = subprocess.run(
                  ["gh", "api", endpoint, "-f", f"head_sha={commit}", "-f", "per_page=100"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if result.returncode:
                  print(result.stderr, file=sys.stderr)
                  raise SystemExit(f"could not inspect {workflow} for {commit}")
              payload = json.loads(result.stdout)
              matching = [
                  item for item in payload.get("workflow_runs", [])
                  if item.get("head_sha") == commit and item.get("status") == "completed"
              ]
              if not matching:
                  raise SystemExit(f"{workflow} has no completed run for {commit}")
              latest = max(matching, key=lambda item: item.get("run_number", 0))
              if latest.get("conclusion") != "success":
                  raise SystemExit(
                      f"{workflow} is not green for {commit}: {latest.get('conclusion')}"
                  )
              print(f"PASS {workflow}: run {latest['id']} on {commit}")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked Runner dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Verify source governance and core release contracts
        run: python scripts/netregress_release.py verify --core-tests

      - name: Generate source-bound release manifest
        run: python scripts/netregress_release.py manifest --manifest results/release-manifest.json

      - name: Generate the 11-scenario acceptance matrix
        run: python scripts/netregress_certification.py --output results/certification-matrix.json

      - name: Assert packet describes all required scenarios and current commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("results/release-manifest.json").read_text(encoding="utf-8"))
          matrix = json.loads(Path("results/certification-matrix.json").read_text(encoding="utf-8"))
          if manifest["source"]["commit"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("release manifest does not describe the checked-out commit")
          if matrix.get("scenario_count") != 11 or len(matrix.get("scenarios", [])) != 11:
              raise SystemExit("certification matrix must contain the complete 11-scenario contract")
          if matrix.get("evidence_complete") is not False:
              raise SystemExit("a matrix-only packet must not claim execution evidence")
          if manifest["production_reproducible"] is not True:
              raise SystemExit("desktop build dependency graph is not fully locked and reproducible")
          dependencies = manifest["dependencies"]
          if not dependencies["runtime_complete"] or not dependencies["build_complete"]:
              raise SystemExit("runtime or desktop build dependency lock validation failed")
          print(json.dumps({
              "commit": manifest["source"]["commit"],
              "application_version": manifest["application"]["version"],
              "runtime_dependencies": manifest["dependencies"]["runtime_complete"],
              "build_dependencies": manifest["dependencies"]["build_complete"],
              "production_reproducible": manifest["production_reproducible"],
              "certification_scenarios": matrix["scenario_count"],
              "certification_evidence_complete": matrix["evidence_complete"],
              "release_packet": "PRE_CERTIFICATION",
          }, indent=2, sort_keys=True))
          PY

      - name: Upload release-readiness packet
        uses: actions/upload-artifact@v4
        with:
          name: netregress-linux-release-readiness-${{ github.sha }}
          path: |
            results/release-manifest.json
            results/certification-matrix.json
          if-no-files-found: error
          retention-days: 30
