name: NetRegress quality gates

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "dashboard/**"
      - "lib/**"
      - "alembic/**"
      - "alembic.ini"
      - "docs/**"
      - "tests/**"
      - "ci_tests/**"
      - "lib/security/**"
      - "requirements.txt"
      - "requirements.lock"
      - "scripts/generate_dependency_locks.sh"
      - "scripts/netregress_security_audit.py"
      - "scripts/start_dashboard.sh"
      - "scripts/test_dashboard_startup.sh"
      - "scripts/netregress_migrate_legacy.py"
      - "scripts/netregress_db.py"
      - "scripts/netregress_install.py"
      - "run_all.sh"
      - "tests/test_dashboard_port_contract.py"
      - "tests/test_auth_flow.py"
      - "tests/test_rbac_auth.py"
      - "tests/test_dashboard_rbac_matrix.py"
      - "tests/test_dashboard_session_enforcement.py"
      - ".github/workflows/netregress-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "dashboard/**"
      - "lib/**"
      - "alembic/**"
      - "alembic.ini"
      - "docs/**"
      - "tests/**"
      - "ci_tests/**"
      - "lib/security/**"
      - "requirements.txt"
      - "requirements.lock"
      - "scripts/generate_dependency_locks.sh"
      - "scripts/netregress_security_audit.py"
      - "scripts/start_dashboard.sh"
      - "scripts/test_dashboard_startup.sh"
      - "scripts/netregress_migrate_legacy.py"
      - "scripts/netregress_db.py"
      - "scripts/netregress_install.py"
      - "run_all.sh"
      - "tests/test_dashboard_port_contract.py"
      - "tests/test_auth_flow.py"
      - "tests/test_rbac_auth.py"
      - "tests/test_dashboard_rbac_matrix.py"
      - "tests/test_dashboard_session_enforcement.py"
      - ".github/workflows/netregress-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netregress-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build production assets
        working-directory: frontend
        run: npm run build

  backend-auth:
    name: Backend session, RBAC, Run and evidence contracts
    runs-on: ubuntu-latest
    env:
      NETREGRESS_CI_MODE: "1"
      NETREGRESS_SESSION_SECRET: netregress-ci-session-secret
      NETREGRESS_SESSION_COOKIE_SECURE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock && python -m pip check
      - name: Validate compatibility shell entry points
        run: >-
          bash -n run_all.sh
          && bash -n scripts/start_dashboard.sh
          && bash -n scripts/generate_dependency_locks.sh
          && bash -n wifi_lab_reprovision_robust.sh
      - name: Run strict source security audit
        run: python scripts/netregress_security_audit.py --strict
      - name: Run API security boundary tests
        run: python -m pytest -q tests/test_api_security.py tests/test_rbac_auth.py tests/test_dashboard_rbac_matrix.py tests/test_dashboard_session_enforcement.py
      - name: Run authentication, dashboard and Phase B–I correctness tests
        run: >-
          python -m pytest
          tests/test_auth_flow.py
          tests/test_rbac_auth.py
          tests/test_dashboard_rbac_matrix.py
          tests/test_dashboard_session_enforcement.py
          tests/test_dashboard_port_contract.py
          tests/test_dashboard_api.py
          tests/test_openapi_contract.py
          tests/test_run_service.py
          tests/test_repositories.py
          tests/test_persistence_foundation.py
          tests/test_artifact_service.py
          tests/test_baseline_promotion.py
          tests/test_domain_models.py
          tests/test_pytest_result_mapping.py
          tests/test_legacy_migration.py
          tests/test_db_helper_compatibility.py
          tests/test_schema_migrations.py
          tests/test_credential_vault.py
          tests/test_configuration_schema_registry.py
          tests/test_configuration_profile_service.py
          tests/test_command_runner.py
          tests/test_run_process.py
          tests/test_configuration_resolver.py
          tests/test_environment_fingerprint.py
          tests/test_resource_lock.py
          tests/test_lab_controller.py
          tests/test_phase_g_orchestration.py
          tests/test_device_firmware_adapters.py
          tests/test_protocol_evidence.py
          tests/test_packet_capture.py
          tests/test_protocol_capture.py
          tests/test_wifi_telemetry.py
          tests/test_metric_collector.py
          tests/test_statistics.py
          tests/test_fault_service.py
          tests/test_ping.py
          tests/test_throughput.py
          tests/test_iterations_23_25.py
          tests/test_sync_service.py
          tests/test_sync_queue.py
          tests/test_regression_intelligence.py
          tests/test_release_readiness.py
          tests/test_standalone_operations.py
          tests/test_repository_governance.py
          tests/test_platform_foundation.py
          tests/test_product_resources.py
          tests/test_project_scope_persistence.py
          ci_tests/test_release_gate.py

  dashboard-startup-smoke:
    name: Dashboard startup, proxy and session smoke test (Node 22.22.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETREGRESS_SESSION_COOKIE_SECURE: "0"
      NETREGRESS_SMOKE_ROOT: /tmp/netregress-dashboard-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22.22.2 (reported local runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock && python -m pip check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Exercise real launcher, Vite proxy and authenticated session lifecycle
        run: bash scripts/test_dashboard_startup.sh
      - name: Upload timestamped dashboard verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-startup-verification-log
          path: /tmp/netregress-dashboard-smoke/local/logs/*.log
          if-no-files-found: warn
          retention-days: 14
