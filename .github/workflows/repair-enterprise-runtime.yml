name: Repair Enterprise Runtime Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix(runtime): register enterprise control plane with dashboard app'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch canonical dashboard entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/app.py')
          s = p.read_text()
          marker = "if __name__=='__main__':"
          integration = "# Enterprise control-plane integration: dashboard.app is the canonical local entrypoint.\n# Importing here (after app creation/routes) prevents the circular import that would occur at module load time.\ntry:\n    import dashboard.enterprise_app  # noqa: F401,E402\nexcept Exception as exc:\n    raise RuntimeError(f'Failed to register NetForge enterprise control plane: {exc}') from exc\n\n"
          if 'import dashboard.enterprise_app  # noqa: F401,E402' not in s:
              if marker not in s:
                  raise SystemExit('Canonical app entrypoint marker not found')
              s = s.replace(marker, integration + marker, 1)
              p.write_text(s)
          PY

      - name: Add cross-entrypoint integration tests
        run: |
          cat > tests/test_runtime_entrypoint_integration.py <<'PY'
          from __future__ import annotations

          import os

          os.environ.setdefault('FLASK_TESTING', '1')
          os.environ.setdefault('NETFORGE_AUTH_DISABLED', '1')

          from dashboard.app import app

          def test_canonical_app_registers_enterprise_routes():
              client = app.test_client()
              assert client.get('/operations').status_code == 200
              assert client.get('/analytics').status_code == 200
              assert client.get('/admin').status_code == 200
              assert client.get('/signup').status_code == 200
              assert client.get('/signin').status_code in {301, 302, 303, 307, 308}
              assert client.get('/api/enterprise/summary').status_code == 200
              assert client.get('/api/enterprise/health/detailed').status_code == 200

          def test_canonical_and_enterprise_route_sets_are_connected():
              routes = {rule.rule for rule in app.url_map.iter_rules()}
              expected = {
                  '/operations', '/analytics', '/admin', '/login', '/signup',
                  '/api/enterprise/summary', '/api/enterprise/executions',
                  '/api/enterprise/analytics/trends', '/api/enterprise/regressions',
                  '/api/enterprise/baselines', '/api/enterprise/users',
              }
              assert expected.issubset(routes)
          PY

      - name: Validate syntax and integration
        run: |
          python -m compileall -q dashboard engine tests
          pytest -q tests/test_runtime_entrypoint_integration.py tests/test_auth_and_ui.py

      - name: Commit repair to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/app.py tests/test_runtime_entrypoint_integration.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(runtime): register enterprise control plane with dashboard app'
          git push origin main
