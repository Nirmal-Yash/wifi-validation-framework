name: NetForge CI/CD Automated QA Pipeline

on:
  push:
    branches: ["main", "master", "refactor/**", "fix/**", "agent/**"]
  pull_request:
    branches: ["main", "master", "fix/**", "agent/**"]

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: netforge-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python Syntax & Imports
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q dashboard engine db scripts tests
          python - <<'PY'
          import importlib
          modules = [
              "dashboard.enterprise_app",
              "dashboard.auth",
              "engine.execution_store",
              "engine.orchestrator",
              "engine.regression_engine",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"import ok: {name}")
          PY

      - name: Validate Database Bootstrap
        env:
          FLASK_TESTING: "1"
          NETFORGE_AUTH_DISABLED: "1"
          NETFORGE_ADMIN_PASSWORD: "test-password-strong"
        run: python db/init_db.py

      - name: Run Non-Privileged Test Suite
        env:
          FLASK_TESTING: "1"
          NETFORGE_AUTH_DISABLED: "1"
          NETFORGE_ADMIN_PASSWORD: "test-password-strong"
          NETFORGE_LIVE_TESTS: "0"
        run: |
          mkdir -p artifacts
          python -m pytest -q -m "not live" --junitxml=artifacts/static-junit.xml

      - name: Upload Static Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netforge-static-test-results
          path: |
            artifacts/static-junit.xml
            db/results.db
          if-no-files-found: ignore
          retention-days: 14

  virtual-kernel-qa:
    name: Tier 1 Virtual QA (mac80211_hwsim)
    needs: static-analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tier 1 System Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            hostapd wpasupplicant dnsmasq isc-dhcp-client \
            iproute2 iw tcpdump ethtool openssl kmod iperf3

      - name: Verify mac80211_hwsim Kernel Capability
        run: |
          set -euxo pipefail
          sudo modprobe mac80211_hwsim radios=3 support_p2p_device=0
          test "$(iw dev | awk '/^phy#/ {count++} END {print count+0}')" -ge 3
          sudo modprobe -r mac80211_hwsim

      - name: Install Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize SQLite Tracking Database
        run: |
          mkdir -p db artifacts/pcaps artifacts/logs
          python db/init_db.py

      - name: Execute Tier 1 Live Regression Suite
        env:
          NETFORGE_LIVE_TESTS: "1"
          FLASK_TESTING: "1"
          NETFORGE_AUTH_DISABLED: "1"
          NETFORGE_ADMIN_PASSWORD: "test-password-strong"
        run: |
          sudo -v
          python -m pytest tests/ -v --fw-version=1.0.0 \
            --junitxml=artifacts/junit-results.xml -m live

      - name: Publish Tier 1 Test Summary
        if: always()
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          path = Path("artifacts/junit-results.xml")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not path.exists():
              with summary_path.open("a", encoding="utf-8") as fh:
                  fh.write("## Tier 1 Virtual QA\n\nNo JUnit report was produced.\n")
              raise SystemExit(0)

          root = ET.parse(path).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = failures = errors = skipped = 0
          for suite in suites:
              tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))
          passed = tests - failures - errors - skipped
          summary = (
              "## Tier 1 Virtual QA\n\n"
              "| Metric | Count |\n|---|---:|\n"
              f"| Total | {tests} |\n| Passed | {passed} |\n"
              f"| Failed | {failures} |\n| Errors | {errors} |\n| Skipped | {skipped} |\n"
          )
          with summary_path.open("a", encoding="utf-8") as fh:
              fh.write(summary)
          PY

      - name: Archive Tier 1 Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netforge-tier1-virtual-evidence
          path: |
            artifacts/junit-results.xml
            artifacts/pcaps/*.pcap
            artifacts/logs/*
            config/*.conf
            config/certs/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Teardown Virtual Topology
        if: always()
        run: |
          sudo bash scripts/teardown_topology.sh || true
