name: NetForge Tier 1 Validation Pipeline

on:
  push:
    branches: [ "main", "refactor/netns-hwsim-architecture" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tier1-virtual-qa:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install System Networking & PCAP Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y isc-dhcp-client sqlite3 tcpdump tshark macchanger bridge-utils vlan

    - name: Inject Virtual Wireless Kernel Modules
      run: |
        # Fetch the exact linux-modules-extra for the active Azure cloud kernel
        sudo apt-get install -y linux-modules-extra-$(uname -r)
        sudo depmod -a
        sudo modprobe mac80211_hwsim radios=3
        
        # Verify the virtual radios initialized successfully
        iwconfig

    - name: Provision Linux Network Namespaces
      run: |
        sudo chmod +x scripts/setup_topology.sh
        sudo ./scripts/setup_topology.sh

    - name: Set up Python 3.10 Execution Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Framework Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite Tracking Database
      run: |
        sqlite3 db/results.db < db/schema.sql

    - name: Execute Regression Engine (Baseline v1.0.0)
      run: |
        # Run pytest and output JUnit XML for GitHub UI rendering
        sudo -E env "PATH=$PATH" python -m pytest tests/ -v --fw-version=1.0.0 --junitxml=artifacts/test-results.xml

    - name: Archive PCAP Artifacts on Failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: network-pcap-evidence
        path: artifacts/pcaps/*.pcap

    - name: Teardown Virtual Environment
      if: always()
      run: |
        sudo chmod +x scripts/teardown_topology.sh
        sudo ./scripts/teardown_topology.sh
