name: NetForge CI/CD Automated QA Pipeline

on:
  push:
    branches: [ "main", "master", "refactor/*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  static-analysis:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax & Scapy Imports
        run: |
          python -m compileall tests/ engine/ dashboard/

  virtual-kernel-qa:
    name: Tier 1 Virtual QA (mac80211_hwsim)
    needs: static-analysis
    runs-on: self-hosted  # CRITICAL FIX: Routes execution to your physical kernel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Clean Previous Lab State
        run: |
          sudo ./scripts/teardown_topology.sh || true
          rm -rf db/results.db artifacts/pcaps/*

      - name: Provision Network Namespaces & Virtual Airwaves
        run: |
          chmod +x scripts/setup_topology.sh scripts/teardown_topology.sh
          sudo ./scripts/setup_topology.sh

      - name: Initialize SQLite Tracking Database
        run: |
          mkdir -p db artifacts/pcaps
          sqlite3 db/results.db < db/schema.sql

      - name: Execute Automated Regression Test Suite (v1.0.0)
        run: |
          sudo -E env "PATH=$PATH" python3 -m pytest tests/ -v --fw-version=1.0.0 --junitxml=artifacts/junit-results.xml

      - name: Publish Test Summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'artifacts/junit-results.xml'

      - name: Archive Network PCAP Evidence on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-pcap-captures
          path: artifacts/pcaps/*.pcap

      - name: Teardown Virtual Environment
        if: always()
        run: |
          sudo ./scripts/teardown_topology.sh || true
