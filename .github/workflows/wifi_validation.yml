name: Wi-Fi Firmware Validation Pipeline

on:
  push:
    branches: [ "main", "refactor/netns-hwsim-architecture" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-20.04  # CRITICAL FIX: Use 20.04 to access the stable 5.x kernel Wi-Fi modules
    
    steps:
    - uses: actions/checkout@v3

    - name: Install System Networking Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y isc-dhcp-client sqlite3 tcpdump tshark macchanger

    - name: Install Kernel Extras for Wi-Fi Simulation
      run: |
        sudo apt-get install -y linux-modules-extra-$(uname -r) linux-modules-extra-azure
        sudo depmod -a

    - name: Initialize Virtual Wi-Fi Hardware (mac80211_hwsim)
      run: |
        sudo modprobe mac80211_hwsim radios=3
        sleep 3
        sudo chmod +x scripts/setup_topology.sh
        sudo ./scripts/setup_topology.sh

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Framework Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite Tracking Database
      run: |
        sqlite3 db/results.db < db/schema.sql

    - name: Execute Regression Test Suite (v1.0.0)
      run: |
        sudo -E env "PATH=$PATH" python -m pytest tests/ -v --fw-version=1.0.0

    - name: Teardown Virtual Environment
      if: always()
      run: |
        sudo chmod +x scripts/teardown_topology.sh
        sudo ./scripts/teardown_topology.sh
