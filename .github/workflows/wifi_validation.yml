name: NetForge CI/CD Automated QA Pipeline

on:
  push:
    branches: ["main", "master", "refactor/**", "fix/**", "agent/**"]
  pull_request:
    branches: ["main", "master", "fix/**", "agent/**"]

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: netforge-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python Syntax & Imports
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q dashboard engine db scripts tests
          python - <<'PY'
          import importlib
          modules = [
              "dashboard.enterprise_app",
              "dashboard.auth",
              "engine.execution_store",
              "engine.orchestrator",
              "engine.regression_engine",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"import ok: {name}")
          PY

      - name: Validate Database Bootstrap
        env:
          FLASK_TESTING: "1"
          NETFORGE_AUTH_DISABLED: "1"
          NETFORGE_ADMIN_PASSWORD: "test-password-strong"
        run: python db/init_db.py

      - name: Run Non-Privileged Test Suite
        env:
          FLASK_TESTING: "1"
          NETFORGE_AUTH_DISABLED: "1"
          NETFORGE_ADMIN_PASSWORD: "test-password-strong"
          NETFORGE_LIVE_TESTS: "0"
        run: |
          mkdir -p artifacts
          python -m pytest -q -m "not live" --junitxml=artifacts/static-junit.xml

      - name: Upload Static Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netforge-static-test-results
          path: |
            artifacts/static-junit.xml
            db/results.db
          if-no-files-found: ignore
          retention-days: 14

  # Tier 1 Virtual QA (mac80211_hwsim) is intentionally not part of hosted CI.
  # It provisions the static virtual Wi-Fi topology from scripts/setup_topology.sh
  # and requires a suitable local Linux kernel/module environment. Run it locally
  # and validate the results before pushing changes.
