name: NetForge CI/CD Automated QA Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_tier1:
        description: "Run the privileged Tier-1 virtual lab"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: write
  statuses: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  static-analysis:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate Python Syntax
        run: python -m compileall -q tests/ engine/ dashboard/
      - name: Validate Database Bootstrap
        run: python db/init_db.py
      - name: Run Non-Privileged Test Suite
        env:
          NETFORGE_LIVE_TESTS: "0"
        run: python -m pytest -q -m "not live"

  virtual-kernel-qa:
    name: Tier 1 Virtual QA (mac80211_hwsim)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tier1 || vars.NETFORGE_TIER1_ENABLED == 'true' }}
    needs: static-analysis
    runs-on: [self-hosted, linux, netforge-tier1]
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Clean Previous Lab State
        run: |
          sudo ./scripts/teardown_topology.sh || true
          rm -f db/results.db
          mkdir -p artifacts/pcaps
          rm -f artifacts/pcaps/*
      - name: Ensure Virtual Environment & Dependencies
        run: |
          if [ ! -d "wifi-venv" ]; then python3 -m venv wifi-venv; fi
          ./wifi-venv/bin/python3 -m pip install --upgrade pip
          ./wifi-venv/bin/python3 -m pip install -r requirements.txt
      - name: Initialize SQLite Tracking Database
        run: |
          mkdir -p db artifacts/pcaps
          ./wifi-venv/bin/python3 db/init_db.py
      - name: Execute Tier 1 Live Regression Suite
        env:
          NETFORGE_LIVE_TESTS: "1"
        run: |
          ./wifi-venv/bin/python3 -m pytest tests/ -v \
            --fw-version=1.0.0 \
            --junitxml=artifacts/junit-results.xml \
            -m live
      - name: Publish Test Summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: artifacts/junit-results.xml
      - name: Archive Tier 1 Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-evidence-${{ github.run_id }}
          path: |
            artifacts/junit-results.xml
            artifacts/pcaps/*.pcap
          if-no-files-found: ignore
      - name: Teardown Virtual Environment
        if: always()
        run: sudo ./scripts/teardown_topology.sh || true
