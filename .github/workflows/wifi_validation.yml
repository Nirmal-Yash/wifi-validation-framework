name: NetForge CI/CD Automated QA Pipeline

on:
  push:
    branches: [ "main", "master", "refactor/*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  static-analysis:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python Syntax & Imports
        run: python -m compileall tests/ engine/ dashboard/
      - name: Run Non-Privileged Test Suite
        run: python -m pytest -q -m 'not live'

  virtual-kernel-qa:
    name: Tier 1 Virtual QA (mac80211_hwsim)
    needs: static-analysis
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Clean Previous Lab State
        run: |
          sudo ./scripts/teardown_topology.sh || true
          rm -rf db/results.db artifacts/pcaps/*
      - name: Ensure Virtual Environment & Dependencies
        run: |
          if [ ! -d "wifi-venv" ]; then python3 -m venv wifi-venv; fi
          ./wifi-venv/bin/python3 -m pip install --upgrade pip
          ./wifi-venv/bin/python3 -m pip install -r requirements.txt
      - name: Initialize SQLite Tracking Database
        run: |
          mkdir -p db artifacts/pcaps
          ./wifi-venv/bin/python3 db/init_db.py
      - name: Execute Tier 1 Live Regression Suite
        run: |
          NETFORGE_LIVE_TESTS=1 ./wifi-venv/bin/python3 -m pytest tests/ -v --fw-version=1.0.0 --junitxml=artifacts/junit-results.xml -m live
      - name: Publish Test Summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'artifacts/junit-results.xml'
      - name: Archive Network PCAP Evidence on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-pcap-captures
          path: artifacts/pcaps/*.pcap
      - name: Teardown Virtual Environment
        if: always()
        run: sudo ./scripts/teardown_topology.sh || true
