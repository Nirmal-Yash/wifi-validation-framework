openapi: 3.0.3
info:
  title: NetRegress Runner API
  version: 1.4.0
servers:
  - url: /api/v1
security:
  - sessionAuth: []
paths:
  /infrastructure/modules:
    get:
      operationId: listInfrastructureModules
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Operator-managed OpenTofu module catalogue; module files are not exposed}
        "400": {description: project_id is required}
        "403": {description: Project infrastructure.read permission required}
        "404": {description: Project not found}
  /infrastructure/workspaces:
    get:
      operationId: listInfrastructureWorkspaces
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
        - {name: lab_id, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Project/Lab-scoped OpenTofu workspaces}
        "403": {description: Project infrastructure.read permission required}
    post:
      operationId: createInfrastructureWorkspace
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, lab_id, name, module_key]
              properties:
                project_id: {type: string}
                lab_id: {type: string}
                name: {type: string, minLength: 1, maxLength: 120}
                module_key: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
  /devices/{device_id}/observations:
    get:
      operationId: listDeviceNetworkObservations
      description: Immutable, SHA-256-verified Linux interface counters collected from the managed Device. Requires devices.read in the owning Project.
      parameters:
        - {name: device_id, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: Project/Lab-scoped observation history with source, capture timestamp, units and integrity digest}
        "403": {description: Project devices.read permission required}
        "404": {description: Device not found}
    post:
      operationId: captureDeviceNetworkObservation
      description: Run only the fixed read-only "ip -s -j link show" command over host-key-verified SSH. Requires devices.operate and a linked active same-device SSH_PASSWORD credential in the OS vault. The payload is never accepted from the caller.
      parameters:
        - {name: device_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "201": {description: Immutable observation snapshot and SHA-256 digest}
        "403": {description: Project devices.operate permission or credential-use scope denied}
        "409": {description: Device archived or SSH credential missing, revoked or unsupported}
        "502": {description: SSH command failed, returned malformed JSON or provided no usable interface counters}
  /devices/{device_id}/capability-reports:
    get:
      operationId: listDeviceCapabilityReports
      description: Read-only history of immutable capability observations recorded by a provider or device-discovery adapter. No API endpoint permits manual capability assertions.
      parameters:
        - {name: device_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Device capability observation history; requires devices.read in the owning Project}
        "403": {description: Project devices.read permission required}
        "404": {description: Device not found}
  /infrastructure/workspaces/{workspace_id}:
    get:
      operationId: getInfrastructureWorkspace
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Workspace metadata without state or credential values}
        "403": {description: Project infrastructure.read permission required}
        "404": {description: Workspace not found}
  /infrastructure/workspaces/{workspace_id}/plans:
    post:
      operationId: createInfrastructurePlan
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind: {type: string, enum: [APPLY, DESTROY]}
      responses:
        "201": {description: Validated binary plan, private plan SHA-256 and bounded review summary; no infrastructure mutation occurs}
        "403": {description: Project infrastructure.manage or infrastructure.destroy permission required}
        "409": {description: Workspace locked, module validation failed or recovery is required}
        "422": {description: OpenTofu CLI or plan failed}
  /infrastructure/plans:
    get:
      operationId: listInfrastructurePlans
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
        - {name: workspace_id, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Project/Lab-scoped plan, approval and execution history}
        "403": {description: Project infrastructure.read permission required}
  /infrastructure/plans/{plan_id}:
    get:
      operationId: getInfrastructurePlan
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Hash-verified plan metadata, bounded resource-action summary and append-only evidence}
        "403": {description: Project infrastructure.read permission required}
        "404": {description: Plan not found}
        "422": {description: Stored binary plan failed SHA-256 verification}
  /infrastructure/plans/{plan_id}/approve:
    post:
      operationId: approveInfrastructurePlan
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_sha256, confirmed]
              properties:
                plan_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  /infrastructure/plans/{plan_id}/apply:
    post:
      operationId: applyInfrastructurePlan
      description: >-
        Apply only the stored binary plan whose exact SHA-256 was independently approved.
        The service reacquires Project/Lab locks and verifies the plan hash immediately before
        invoking OpenTofu. A failed or timed-out apply is marked RECOVERY_REQUIRED; there is no
        automatic retry or rollback.
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_sha256, confirmed]
              properties:
                plan_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  /infrastructure/workspaces/{workspace_id}/state:
    get:
      operationId: inspectInfrastructureWorkspaceState
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Safe resource addresses and counts only; raw Terraform state values are never exposed}
        "403": {description: Project infrastructure.read permission required}
        "409": {description: Lab/workspace state is locked}
  /infrastructure/workspaces/{workspace_id}/resources:
    get:
      operationId: listInfrastructureResourceBindings
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Versioned topology bindings including ACTIVE/SUPERSEDED history and latest safe observed status}
        "403": {description: Project infrastructure.read permission required}
        "404": {description: Workspace not found}
    post:
      operationId: createInfrastructureResourceBinding
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resource_address, topology_profile_id, topology_revision_id, topology_node_id]
              properties:
                resource_address: {type: string, minLength: 1, maxLength: 512}
                topology_profile_id: {type: string}
                topology_revision_id: {type: string}
                topology_node_id: {type: string, minLength: 1, maxLength: 64}
                expected_current_binding_id: {type: string, pattern: '^[a-f0-9]{32}$', description: Required when replacing an existing active mapping; protects against stale remapping.}
      responses:
        "201": {description: Existing state resource bound to a logical node in an active Project/Lab topology profile and immutable published revision; replacement uses expected_current_binding_id and preserves the superseded mapping}
        "403": {description: Project infrastructure.manage and topology.read permissions required}
        "404": {description: Workspace, profile, revision or node not found}
        "409": {description: Resource is not present in state, topology scope conflicts, or profile/revision is not active/published}
        "422": {description: Invalid resource mapping}
  /infrastructure/workspaces/{workspace_id}/reconciliations:
    get:
      operationId: listInfrastructureReconciliations
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Append-only history of safe OpenTofu state/resource reconciliation snapshots}
        "403": {description: Project infrastructure.read permission required}
        "404": {description: Workspace not found}
  /infrastructure/workspaces/{workspace_id}/reconcile:
    post:
      operationId: reconcileInfrastructureWorkspace
      description: >-
        Creates an OpenTofu refresh-only plan and compares the current saved state,
        detected provider drift and immutable topology resource bindings. Records only
        resource addresses, type, actions, binding IDs and counts; raw state values,
        provider attributes, outputs and credentials are never returned or persisted
        in the reconciliation summary. No infrastructure changes are applied.
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "200": {description: Immutable reconciliation snapshot with drift, orphan and missing-resource counts and state SHA-256}
        "403": {description: Project infrastructure.reconcile permission required}
        "409": {description: Workspace locked or unavailable}
        "422": {description: OpenTofu state or refresh-only plan unavailable}
  /infrastructure/workspaces/{workspace_id}/recover:
    post:
      operationId: recoverInfrastructureWorkspace
      description: >-
        Explicitly reconcile a RECOVERY_REQUIRED workspace after a failed or timed-out
        apply, then create a new RECOVERY plan tied to that exact immutable reconciliation.
        This endpoint does not apply, replay, roll back or retry infrastructure. The
        resulting plan still requires independent hash-pinned approval and explicit apply.
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed]
              properties:
                confirmed: {type: boolean, enum: [true]}
      responses:
        "201": {description: Reconciliation snapshot and a hash-pinned RECOVERY plan for review}
        "403": {description: Project infrastructure.execute and infrastructure.reconcile permissions required}
        "409": {description: Workspace is not in RECOVERY_REQUIRED state or a lock/plan conflict exists}
        "422": {description: OpenTofu reconciliation or recovery planning failed}
  /network-intent/profiles:
    get:
      operationId: listNetworkIntentProfiles
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Project-scoped Network Intent profiles}
        "403": {description: Project network_intent.read permission required}
        "404": {description: Project not found}
    post:
      operationId: createNetworkIntentProfile
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, topology_profile_id, name]
              properties:
                project_id: {type: string, minLength: 1}
                topology_profile_id: {type: string, minLength: 1}
                name: {type: string, minLength: 1, maxLength: 120}
                description: {type: string, maxLength: 500}
      responses:
        "201": {description: Network Intent profile bound to a topology profile with inherited Project/Lab scope}
        "400": {description: Invalid profile definition}
        "403": {description: Project network_intent.manage permission required}
        "404": {description: Topology profile not found in this Project}
        "409": {description: Duplicate or conflicting profile name}
  /network-intent/profiles/{profile_id}:
    get:
      operationId: getNetworkIntentProfile
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Network Intent profile metadata}
        "403": {description: Project network_intent.read permission required}
        "404": {description: Network Intent profile not found}
  /network-intent/profiles/{profile_id}/revisions:
    get:
      operationId: listNetworkIntentRevisions
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Immutable Network Intent revisions and topology revision pins}
        "403": {description: Project network_intent.read permission required}
        "404": {description: Network Intent profile not found}
    post:
      operationId: createNetworkIntentRevision
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topology_revision_id, definition]
              properties:
                topology_revision_id: {type: string}
                definition: {$ref: '#/components/schemas/NetworkIntentDefinition'}
                provenance: {type: object}
                parent_revision_id: {type: string}
      responses:
        "201": {description: Immutable DRAFT revision pinned to the topology revision ID and content hash}
        "403": {description: Project network_intent.manage permission required}
        "404": {description: Profile or topology revision not found in this Project}
        "409": {description: Profile archived or revision scope conflict}
        "422": {description: Invalid Network Intent definition}
  /network-intent/compiler/adapters:
    get:
      operationId: listNetworkIntentCompilerAdapters
      description: >-
        List registered vendor configuration compilers. This catalogue is distinct from emulator/provider
        adapters and does not imply device reachability or observed capabilities.
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Registered adapter descriptors and tested software ranges}
        "400": {description: project_id is required}
        "403": {description: Project network_intent.read permission required}
        "404": {description: Project not found}
  /network-intent/profiles/{profile_id}/revisions/{revision_id}/compile:
    post:
      operationId: compileNetworkIntentRevision
      description: >-
        Compile one immutable PUBLISHED Network Intent revision into deterministic vendor configuration
        previews. Compilation revalidates the pinned topology and current adapter-observed capability reports,
        and returns either all target artifacts or zero artifacts. No device connection, CLI execution,
        configuration write, commit, deployment or read-back is performed.
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
        - {name: revision_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                baseline_artifacts:
                  type: object
                  description: Transient relative-path to text mapping used only for deterministic diff preview; never persisted.
                  maxProperties: 128
                  additionalProperties: {type: string, maxLength: 500000}
      responses:
        "200": {description: COMPILED preview or BLOCKED diagnostics; application_performed is always false}
        "403": {description: Project network_intent.manage permission required}
        "404": {description: Profile or revision not found in the selected scope}
        "422": {description: Unsafe or oversized baseline artifact request}
  /network-intent/profiles/{profile_id}/revisions/{revision_id}/ansible-plan:
    post:
      operationId: createNetworkIntentAnsiblePlan
      description: >-
        Create a Project/Lab-scoped Ansible plan from a PUBLISHED immutable Network Intent revision.
        The server recompiles the revision through P09, requires current adapter observations and
        same-Device OS-vault SSH credential references, generates a fixed Ansible playbook and static
        inventory, then performs syntax/inventory validation. Plan creation never connects to Devices
        or applies configuration. Only Linux/FRR, Cisco IOS/IOS-XE and Arista EOS are enabled for
        the initial Ansible SSH/network_cli execution path; Juniper Junos and Palo Alto PAN-OS remain
        compiler-only until their separate NETCONF/API transports are qualified.
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
        - {name: revision_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_bindings]
              additionalProperties: false
              properties:
                credential_bindings:
                  type: object
                  minProperties: 1
                  maxProperties: 256
                  additionalProperties: {type: string, minLength: 1, maxLength: 128}
                  description: Map every target Device ID to an active same-Device SSH_PASSWORD or SSH_PRIVATE_KEY vault credential ID; secret values are forbidden.
      responses:
        "201": {description: Persisted PREVIEWED/BLOCKED hash-pinned plan and static inventory; no Device connection is made}
        "200": {description: Compilation was blocked before an Ansible plan could be persisted}
        "400": {description: Invalid credential binding request}
        "403": {description: Project network_automation.manage permission required}
        "404": {description: Network Intent profile or revision not found}
        "409": {description: Stale capability observation, unsupported execution transport, or invalid revision lifecycle}
        "422": {description: Vault, Ansible runtime, collection or playbook validation failure}
  /network-intent/automation/ansible/plans:
    get:
      operationId: listNetworkIntentAnsiblePlans
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Project-scoped immutable Ansible plan, approval and execution history}
        "400": {description: project_id is required}
        "403": {description: Project network_automation.read permission required}
        "404": {description: Project not found}
  /network-intent/automation/ansible/plans/{plan_id}:
    get:
      operationId: getNetworkIntentAnsiblePlan
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Hash-verified plan and append-only approval/execution evidence; credential material excluded}
        "403": {description: Project network_automation.read permission required}
        "404": {description: Plan not found}
        "422": {description: Stored plan failed its SHA-256 integrity check}
  /network-intent/automation/ansible/plans/{plan_id}/approve:
    post:
      operationId: approveNetworkIntentAnsiblePlan
      description: >-
        Approve exactly one validated PREVIEWED plan SHA-256. The creator cannot approve their
        own plan; an independent authorized ADMIN/OWNER must review and approve it. Approval
        appends immutable evidence and does not execute the plan.
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_sha256, confirmed]
              additionalProperties: false
              properties:
                plan_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  /network-intent/automation/ansible/plans/{plan_id}/execute:
    post:
      operationId: executeNetworkIntentAnsiblePlan
      description: >-
        Execute an explicitly approved and hash-matched plan. Immediately before connecting,
        NetRegress revalidates the published intent, topology pin, capabilities and deterministic
        compiler output. A mismatch marks the plan STALE and prevents execution. Live execution
        uses the OS Credential Vault, verified SSH host keys, per-Lab/Device locks and bounded
        Ansible subprocess execution. A partial failure may leave earlier Devices changed and
        therefore requires explicit reconciliation; no automatic retry or rollback is claimed.
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_sha256, confirmed]
              additionalProperties: false
              properties:
                plan_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  /network-intent/profiles/{profile_id}/publish:
    post:
      operationId: publishNetworkIntentRevision
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                revision_id: {type: string}
      responses:
        "200": {description: Publish immutable intent; requires published topology and supported target capability observations}
        "403": {description: Project network_intent.publish permission required}
        "404": {description: Profile or revision not found}
        "409": {description: Topology not published, capability unknown or unsupported, or revision not DRAFT}
  /network-intent/profiles/{profile_id}/rollback:
    post:
      operationId: rollbackNetworkIntentRevision
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_revision_id]
              properties:
                source_revision_id: {type: string}
      responses:
        "201": {description: Create a new DRAFT from a PUBLISHED revision; history is never rewritten}
        "403": {description: Project network_intent.manage permission required}
        "404": {description: Profile or source revision not found}
        "409": {description: Source revision is not PUBLISHED}
  /network-intent/validate:
    post:
      operationId: validateNetworkIntent
      description: >-
        Read-only validation of schema v1.0 Network Intent against an immutable canonical topology revision.
        Capability evaluation is opt-in. Missing target bindings or unreported required features are UNKNOWN
        and block publication; explicitly unsupported features are INCOMPATIBLE. This endpoint neither
        compiles nor applies vendor configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, topology_revision_id, definition]
              properties:
                project_id: {type: string}
                profile_id: {type: string}
                topology_revision_id: {type: string}
                evaluate_capabilities: {type: boolean, default: false}
                definition: {$ref: '#/components/schemas/NetworkIntentDefinition'}
      responses:
        "200": {description: Validation result, canonical hash, required capabilities and diagnostics}
        "400": {description: Invalid validation request}
        "403": {description: Project network_intent.manage permission required}
  /topologies/native-codecs:
    get:
      operationId: listNativeTopologyCodecs
      description: Registered native project-file codecs; independent of runtime provider adapters.
      responses:
        "200": {description: GNS3, CML and EVE-NG native file codecs and their declared support scope}
  /topologies/import/native:
    post:
      operationId: importNativeTopologyProject
      description: >-
        Import a GNS3 .gns3, CML lab .yaml/.yml or supported legacy .virl, or EVE-NG .unl
        file into a new immutable canonical topology revision. Original source bytes and SHA-256
        are retained as Project-scoped immutable provenance. Node configurations, credentials,
        controller calls, emulator resources and image assets are not executed or provisioned.
        The initial export subset edits only mapped layout/labels; unsupported semantic changes fail closed.
        Reopening in the originating vendor application remains an external acceptance gate.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project_id, name, file]
              properties:
                project_id: {type: string, minLength: 1}
                name: {type: string, minLength: 1, maxLength: 120}
                scope_type: {type: string, enum: [PROJECT, LAB], default: PROJECT}
                scope_id: {type: string, maxLength: 128, description: Required for LAB scope}
                file: {type: string, format: binary, description: GNS3 .gns3, CML .yaml/.yml/.virl, or EVE-NG .unl source; maximum 50 MiB}
      responses:
        "201": {description: Imported DRAFT canonical revision, native source provenance and initial DRAFT presentation}
        "400": {description: Missing fields or invalid idempotency key}
        "403": {description: Project topology.manage permission required}
        "409": {description: Idempotency key reuse or topology profile name conflict}
        "413": {description: Upload exceeds the 50 MiB native source limit}
        "422": {description: Malformed, unsupported or unsafe native project file}
  /topologies/{profile_id}/native-artifacts:
    get:
      operationId: listNativeTopologyArtifacts
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Immutable native source provenance and SHA-256 metadata; source bytes excluded}
        "403": {description: Project topology.read permission required}
        "404": {description: Topology profile not found}
  /topologies/{profile_id}/native-artifacts/{source_id}/export:
    get:
      operationId: exportNativeTopologyRevision
      description: >-
        Export a selected PUBLISHED topology revision and PUBLISHED presentation revision against
        its associated immutable native source artifact. Only explicitly mapped presentation edits
        are serialized; all unsupported native objects and configuration data remain source-preserved.
        This codec read-back does not certify reopening in the vendor application.
      parameters:
        - {name: profile_id, in: path, required: true, schema: {type: string}}
        - {name: source_id, in: path, required: true, schema: {type: string}}
        - {name: revision_id, in: query, required: true, schema: {type: string}}
        - {name: presentation_id, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Serialized native GNS3, CML or EVE-NG project file
          headers:
            X-NetRegress-Native-Report: {schema: {type: string}, description: Base64url-encoded export provenance and supported edit subset}
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        "403": {description: Project topology.manage permission required}
        "404": {description: Source, topology revision or presentation not found}
        "409": {description: Unpublished revision or unsupported topology edit}
        "422": {description: Source integrity or serialization failure}
  /topologies/import/packet-tracer:
    post:
      operationId: importPacketTracerProject
      description: >-
        Import a native Cisco Packet Tracer .pkt file into the existing canonical topology domain.
        Original bytes, SHA-256, codec/version, provenance and compatibility report are retained
        immutably. Logical devices are not assigned provider templates and no emulator operation is
        performed. The first native export subset supports name and canvas-coordinate edits only.
        Codec read-back does not certify reopening in the Packet Tracer desktop application.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project_id, name, file]
              properties:
                project_id: {type: string, minLength: 1}
                name: {type: string, minLength: 1, maxLength: 120}
                scope_type: {type: string, enum: [PROJECT, LAB], default: PROJECT}
                scope_id: {type: string, maxLength: 128, description: Required when scope_type is LAB}
                file: {type: string, format: binary, description: Native .pkt file, maximum 3.5 MB}
      responses:
        "201":
          description: Imported canonical DRAFT revision and immutable native source metadata
        "400":
          description: Missing fields or invalid idempotency key
        "403":
          description: Project topology.manage permission required
        "409":
          description: Idempotency key reuse or profile name conflict
        "413":
          description: Upload exceeds configured request or native file size limit
        "422":
          description: Malformed, unsupported or invalid Packet Tracer file
  /topologies/{profile_id}/native-sources:
    get:
      operationId: listTopologyNativeSources
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Immutable native source provenance and conversion reports (source bytes excluded)
        "403":
          description: Project topology.read permission required
        "404":
          description: Topology profile not found
  /topologies/{profile_id}/native-sources/{source_id}/export:
    get:
      operationId: exportPacketTracerRevision
      description: >-
        Export a selected revision against the retained Packet Tracer native source.
        Unmapped semantic edits and link changes are rejected. The response includes an
        X-NetRegress-Export-Report header. Packet Tracer desktop reopening remains an
        external acceptance gate.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string}
        - name: source_id
          in: path
          required: true
          schema: {type: string}
        - name: revision_id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Native Packet Tracer .pkt file
          headers:
            X-NetRegress-Export-Report:
              schema: {type: string}
              description: Base64url-encoded JSON compatibility and codec read-back report
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "403":
          description: Project topology.manage permission required
        "404":
          description: Native source, profile or revision not found
        "409":
          description: Export would lose unsupported topology changes
        "422":
          description: Native source integrity or serialization failure
  /topologies/{profile_id}/revisions/{topology_revision_id}/presentation-revisions:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema: {type: string}
      - name: topology_revision_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listTopologyPresentationRevisions
      description: >-
        Return immutable presentation snapshots associated with one canonical topology revision.
        Older topology revisions with no presentation record return an empty list; no vendor layout
        is invented or silently assigned.
      responses:
        "200": {description: Presentation revision history; source bytes are excluded}
        "403": {description: Project topology.read permission required}
        "404": {description: Profile or canonical topology revision not found in that profile}
    post:
      operationId: createTopologyPresentationRevision
      description: >-
        Create an immutable DRAFT presentation snapshot pinned to the exact canonical topology revision
        and SHA-256. Schema version 1.0 stores native coordinate space, canvas and viewport, grid,
        node dimensions/rotation/labels/port anchors, link route geometry, drawings, layers and bounded
        namespaced extensions. NATIVE layout requires a matching immutable source-artifact provenance
        record. This endpoint does not parse, serialize or claim compatibility with a vendor file format.
        Mutations require the standard Idempotency-Key header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [presentation]
              properties:
                presentation:
                  type: object
                  additionalProperties: false
                  required: [schema_version, layout_origin]
                  properties:
                    schema_version: {type: string, enum: ["1.0"]}
                    layout_origin: {type: string, enum: [NATIVE, MANUAL, NETREGRESS]}
                    format_id: {type: string, maxLength: 64}
                    format_version: {type: string, maxLength: 32}
                    source_artifact_id: {type: string, maxLength: 64}
                    coordinate_space:
                      type: object
                      required: [unit, origin]
                      properties:
                        unit: {type: string, enum: [px, pt, mm, grid, native]}
                        origin: {type: string, enum: [top_left, bottom_left, center]}
                        x_axis: {type: string, enum: [left, right], default: right}
                        y_axis: {type: string, enum: [up, down], default: down}
                        scale: {type: number, minimum: 0.0001, maximum: 10000}
                        offset_x: {type: number}
                        offset_y: {type: number}
                    canvas:
                      type: object
                      required: [width, height]
                      properties:
                        width: {type: integer, minimum: 1, maximum: 100000}
                        height: {type: integer, minimum: 1, maximum: 100000}
                        background: {type: string, maxLength: 64}
                    viewport:
                      type: object
                      required: [x, y, width, height]
                      properties:
                        x: {type: number}
                        y: {type: number}
                        width: {type: number, minimum: 1}
                        height: {type: number, minimum: 1}
                        zoom: {type: number, minimum: 0.01, maximum: 100}
                    grid:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        snap: {type: boolean}
                        size: {type: number, minimum: 1, maximum: 1000}
                    nodes:
                      type: array
                      maxItems: 128
                      items:
                        type: object
                        required: [node_id, x, y]
                        properties:
                          node_id: {type: string, maxLength: 64}
                          native_id: {type: string, maxLength: 128}
                          x: {type: number}
                          y: {type: number}
                          width: {type: number, minimum: 1, maximum: 10000}
                          height: {type: number, minimum: 1, maximum: 10000}
                          rotation: {type: number, minimum: -360, maximum: 360}
                          icon_ref: {type: string, maxLength: 256}
                          icon_asset_path: {type: string, maxLength: 512}
                          template_ref: {type: string, maxLength: 256}
                          z_index: {type: integer}
                          label: {type: string, maxLength: 256}
                          layer_id: {type: string, maxLength: 64}
                          ports: {type: array, maxItems: 64, items: {type: object}}
                          extensions: {type: object, maxProperties: 16}
                    links:
                      type: array
                      maxItems: 512
                      items:
                        type: object
                        required: [link_id]
                        properties:
                          link_id: {type: string, maxLength: 64}
                          native_id: {type: string, maxLength: 128}
                          route_style: {type: string, enum: [direct, polyline, orthogonal, curved, native]}
                          points: {type: array, maxItems: 64, items: {type: object, required: [x, y]}}
                          label: {type: string, maxLength: 256}
                          z_index: {type: integer}
                          extensions: {type: object, maxProperties: 16}
                    drawings: {type: array, maxItems: 1000, items: {type: object}}
                    layers: {type: array, maxItems: 64, items: {type: object}}
                    extensions: {type: object, maxProperties: 16}
      responses:
        "201": {description: Immutable DRAFT presentation revision created and bound to canonical topology hash}
        "400": {description: Invalid idempotency key or malformed JSON request}
        "403": {description: Project topology.manage permission required}
        "404": {description: Profile or canonical topology revision not found in that profile}
        "409": {description: Idempotency conflict or invalid lifecycle transition}
        "422": {description: Unsupported schema, invalid geometry, unsafe paths or unbounded extensions}
  /topologies/{profile_id}/presentation-revisions/{presentation_id}/publish:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema: {type: string}
      - name: presentation_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: publishTopologyPresentationRevision
      description: >-
        Publish a DRAFT presentation revision only after its exact pinned canonical topology revision
        is PUBLISHED. Published presentation metadata, hashes, source mappings and presentation JSON
        are immutable. Mutations require the standard Idempotency-Key header.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, maxProperties: 0}
      responses:
        "200": {description: Published immutable presentation revision}
        "403": {description: Project topology.publish permission required}
        "404": {description: Presentation revision not found in that profile}
        "409": {description: Canonical topology is not published or presentation transition is invalid}
  /topologies/validate:
    post:
      operationId: validateTopologyDraft
      description: >-
        Validate a visual topology draft against the canonical, read-only Project-scoped topology rules.
        Optional logical node and interface network-intent fields are normalized and hashed with the
        definition. template_id may be empty for an unmapped provider-independent logical node; a
        later provider dry-run blocks unmapped nodes. configuration_profile_id must identify a PUBLISHED profile backed by an ACTIVE schema in the
        same Project. credential_ref_id must identify an ACTIVE Vault record in the same Project. Their read permissions are checked when
        the reference is supplied. credential_ref_id is an opaque Credential Vault reference ID only; never credential material or a
        secret value is accepted or returned. Does not persist a revision or contact a provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, definition]
              properties:
                project_id: {type: string, minLength: 1}
                profile_id: {type: string}
                definition:
                  type: object
                  required: [nodes, links]
                  properties:
                    nodes:
                      type: array
                      maxItems: 128
                      items:
                        type: object
                        required: [id, name, node_type, x, y]
                        properties:
                          id: {type: string, maxLength: 64}
                          name: {type: string, maxLength: 120}
                          node_type: {type: string, enum: [ROUTER, SWITCH, ACCESS_POINT, CLIENT, MONITOR, CLOUD, OTHER]}
                          template_id: {type: string, maxLength: 128, description: Optional provider-specific template mapping; empty means logical-only/unmapped}
                          x: {type: number, minimum: 0, maximum: 10000}
                          y: {type: number, minimum: 0, maximum: 10000}
                          vendor: {type: string, maxLength: 80}
                          operating_system: {type: string, maxLength: 80}
                          image: {type: string, maxLength: 128}
                          cpu_cores: {type: integer, minimum: 1, maximum: 128}
                          memory_mb: {type: integer, minimum: 128, maximum: 1048576}
                          management_address: {type: string, maxLength: 64, description: IPv4/IPv6 address with optional prefix}
                          default_gateway: {type: string, maxLength: 64}
                          vlan_id: {type: integer, minimum: 1, maximum: 4094}
                          configuration_profile_id: {type: string, maxLength: 128}
                          credential_ref_id: {type: string, maxLength: 128, description: Opaque Credential Vault reference ID only; never a secret}
                          properties: {type: object, maxProperties: 32}
                          interfaces:
                            type: array
                            maxItems: 64
                            items:
                              type: object
                              required: [name, adapter, port]
                              properties:
                                name: {type: string, maxLength: 64}
                                adapter: {type: integer, minimum: 0, maximum: 255}
                                port: {type: integer, minimum: 0, maximum: 255}
                                mode: {type: string, enum: [ACCESS, TRUNK, ROUTED, WIRELESS, OTHER]}
                                ip_address: {type: string, maxLength: 64}
                                vlan_id: {type: integer, minimum: 1, maximum: 4094}
                                description: {type: string, maxLength: 160}
                    links:
                      type: array
                      maxItems: 512
                      items:
                        type: object
                        required: [id, source_node_id, source_adapter, source_port, target_node_id, target_adapter, target_port]
                        properties:
                          id: {type: string, maxLength: 64}
                          source_node_id: {type: string, maxLength: 64}
                          source_adapter: {type: integer, minimum: 0, maximum: 255}
                          source_port: {type: integer, minimum: 0, maximum: 255}
                          source_interface_name: {type: string, maxLength: 64}
                          target_node_id: {type: string, maxLength: 64}
                          target_adapter: {type: integer, minimum: 0, maximum: 255}
                          target_port: {type: integer, minimum: 0, maximum: 255}
                          target_interface_name: {type: string, maxLength: 64}
                          link_type: {type: string, enum: [ETHERNET, WIRELESS, SERIAL, TUNNEL, OTHER]}
                          network_segment_id: {type: string, maxLength: 128}
                          vlan_id: {type: integer, minimum: 1, maximum: 4094}
      responses:
        "200": {description: Canonical topology is valid; returns node/link counts and SHA-256}
        "400": {description: Missing Project scope or malformed request}
        "403": {description: Caller lacks topology.manage in this Project}
        "404": {description: Project, selected profile, credential or configuration profile not found in the supplied Project}
        "422": {description: Topology definition, interface or reference state violates canonical constraints}
  /dashboard/operations-overview:
    get:
      summary: Read a Project/Lab operational overview
      operationId: getOperationsOverview
      description: >-
        Read-only aggregation of persisted Project, Lab, device, topology, provider binding,
        configuration deployment, pipeline, Run, evidence and valid performance sample records.
        Requires workspace.read for the Project. Section data is independently redacted by
        devices.read, topology.read, pipelines.read, runs.read, configurations.read,
        evidence.read and performance.read. Does not launch Runs, mutate records, contact
        provider controllers, synthesize telemetry, infer device reachability or infer drift.
        Provider health remains UNKNOWN until an actual health observation is recorded.
      parameters:
        - name: project_id
          in: query
          required: true
          description: Project whose persisted operational records are summarized.
          schema: {type: string, minLength: 1}
        - name: lab_id
          in: query
          required: false
          description: Optional Lab filter owned by project_id; labs.total remains Project-wide.
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Project/Lab operational overview with independent access flags, source provenance, and query/source timestamps
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [observed_at, scope, labs, devices, topology, providers, pipelines, runs, configuration, evidence, performance, network_health, action_items]
                    properties:
                      observed_at: {type: string, format: date-time}
                      scope: {type: object}
                      labs: {type: object}
                      devices: {type: object}
                      topology: {type: object}
                      providers: {type: object}
                      pipelines: {type: object}
                      runs: {type: object}
                      configuration: {type: object}
                      evidence: {type: object}
                      performance: {type: object}
                      network_health: {type: object}
                      action_items: {type: object}
        "400": {description: Missing project_id or invalid request (INVALID_REQUEST)}
        "401": {description: Missing or invalid authenticated session (UNAUTHENTICATED)}
        "403": {description: Caller cannot access the selected Project (FORBIDDEN)}
        "404": {description: Project or Lab not found in the selected Project (NOT_FOUND)}
        "500": {description: Unexpected dashboard query failure}
  /providers/registry:
    get:
      operationId: listProviderRegistry
      summary: List registered provider adapters, capabilities and Project connections
      description: >-
        Read-only local registry discovery scoped by project_id and topology.read.
        Returns registered adapter metadata, declared capabilities and persisted
        Project/Lab connection references. Does not contact a provider controller,
        verify live connectivity or resolve/return Credential Vault secret material.
        Provider operational health remains UNKNOWN until an explicit source observation exists.
      parameters:
        - name: project_id
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {description: Provider descriptors and persisted scoped connection references}
        "400": {description: Missing project_id (INVALID_REQUEST)}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the selected Project}
  /labs/{lab_id}/provider-binding:
    get:
      operationId: getLabProviderBinding
      summary: Read the Project/Lab provider binding
      description: >-
        Returns safe Project/Lab-scoped provider binding metadata. Provider credential
        values are never included. Requires topology.read.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {description: Provider binding metadata or null}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the Lab's Project}
    put:
      operationId: bindLabTopologyProvider
      summary: Verify and persist a private topology-provider binding
      description: >-
        Binds a GNS3, Cisco Modeling Labs or EVE-NG controller Device and Credential Vault
        API credential to a Lab. Provider workspace reachability is verified before binding
        persistence. provider_workspace_id is canonical; gns3_project_id is retained as a
        backwards-compatible GNS3 alias. Credentials are never included in responses.
        Requires topology.provider.manage and Idempotency-Key.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, endpoint_url, provider_workspace_id, controller_device_id, credential_id]
              properties:
                provider_id: {type: string, enum: [gns3, cml, eve-ng]}
                endpoint_url: {type: string, maxLength: 512}
                provider_workspace_id: {type: string, minLength: 1, maxLength: 512}
                gns3_project_id: {type: string, deprecated: true}
                controller_device_id: {type: string, minLength: 1}
                credential_id: {type: string, minLength: 1}
      responses:
        "200": {description: Verified provider binding metadata}
        "400": {description: Invalid provider, workspace or binding request}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.provider.manage in the Lab's Project}
        "404": {description: Lab or selected provider workspace not found}
        "409": {description: Device, credential or provider scope conflict}
    delete:
      operationId: archiveLabTopologyProviderBinding
      summary: Archive a provider binding without deleting provider resources
      description: >-
        Archives the active Project/Lab provider binding and preserves its audit history.
        It does not delete the provider lab, nodes, links or other controller resources.
        Requires topology.provider.manage and Idempotency-Key.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        "200": {description: Archived provider binding metadata}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.provider.manage in the Lab's Project}
        "404": {description: Active provider binding not found}
  /labs/{lab_id}/provider-observations:
    get:
      operationId: listLabProviderObservations
      summary: List immutable provider health, version, compute and packet-capture capability observations
      description: Requires topology.read in the Lab Project. Returns timestamped provider observation history with SHA-256 integrity metadata and source provenance.
      parameters:
        - {name: lab_id, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 40}}
      responses:
        "200": {description: Provider observation history}
        "403": {description: Caller lacks topology.read}
        "404": {description: Lab not found}
    post:
      operationId: captureLabProviderObservation
      summary: Capture a read-only provider observation
      description: Requires topology.read. The server uses the registered adapter and shared Credential Vault session to observe real provider health, version, compute resource measurements and packet-capture capability. caller-supplied measurements and provider connection values are not accepted. An unavailable provider is retained as an UNAVAILABLE observation with safe error classification only.
      parameters:
        - {name: lab_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "201": {description: Immutable provider observation snapshot and SHA-256 digest}
        "403": {description: Caller lacks topology.read}
        "404": {description: Lab or active provider binding not found}
        "409": {description: Provider observation contract or binding is invalid}
  /labs/{lab_id}/provider-catalog:
    get:
      operationId: inspectLabProviderCatalog
      summary: Inspect the bound provider project, templates, nodes, links and compute observations
      description: >-
        Performs a bounded, authenticated, read-only observation through the registered
        provider adapter and the Lab's Credential Vault reference. Requires topology.read
        in the Lab's Project. Returns the controller project catalogue, safe template
        metadata, actual node/link inventory, compute connectivity/utilization observations,
        node lifecycle counts and adapter-level packet-capture capability. Image availability
        is returned by the dry-run plan for the templates mapped by its immutable revision.
        No provider resources are created, deleted, started, stopped or rewired.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {description: Actual provider catalogue and current compute resource observations}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the Lab's Project}
        "404": {description: Lab or active provider binding not found}
        "502": {description: Provider catalogue observation failed}
  /labs/{lab_id}/provider-nodes/{provider_node_id}/interfaces:
    get:
      operationId: inspectLabProviderNodeInterfaces
      summary: Inspect actual provider interfaces for an observed node
      description: >-
        Resolves the active Project/Lab binding, opens a read-only provider session
        through the Credential Vault and verifies the provider node exists in the bound
        controller project before returning its actual adapter/port inventory. Requires
        topology.read. Does not create or modify provider resources.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: provider_node_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Actual provider interface inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [lab_id, project_id, provider_project_id, provider_node_id, interfaces, observed_at]
                    properties:
                      lab_id: {type: string}
                      project_id: {type: string}
                      provider_project_id: {type: string}
                      provider_node_id: {type: string}
                      observed_at: {type: string, format: date-time}
                      interfaces:
                        type: array
                        items:
                          type: object
                          properties:
                            adapter_number: {type: integer, minimum: 0, maximum: 255}
                            port_number: {type: integer, minimum: 0, maximum: 255}
                            name: {type: string}
                            short_name: {type: string}
                            link_type: {type: string}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the Lab's Project}
        "404": {description: Lab, binding or observed provider node not found}
        "502": {description: Provider interface observation failed}
  /topologies/{profile_id}/plan:
    post:
      operationId: planTopologyProviderApply
      summary: Build a read-only provider topology apply plan
      description: >-
        Requires topology.read for the topology profile's Project and a published immutable
        revision scoped to the selected Lab. Uses the common provider adapter to observe
        provider projects, template catalogue, compute availability, mapped-template image
        availability, actual nodes and links. The plan reports template/compute/image
        compatibility, provider node lifecycle and port conflicts. UNKNOWN observations
        remain explicit and do not become claims of availability. No provider resources
        are mutated; a later apply must re-check live observations and the revision SHA-256
        and require explicit confirmation.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                revision_id: {type: string, minLength: 1}
      responses:
        "200": {description: Dry-run plan, template compatibility and actual provider observations}
        "400": {description: Invalid plan request}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the profile's Project}
        "404": {description: Profile, revision or active provider binding not found}
        "409": {description: Provider state conflicts with the published topology}
        "502": {description: Provider observation failed}
  /health: {get: {security: [], responses: {"200": {description: Healthy}}}}
  /readiness: {get: {responses: {"200": {description: Ready}}}}
  /auth/csrf:
    get: {responses: {"200": {description: CSRF token}}}
  /auth/login:
    post:
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {"200": {description: Authenticated}, "401": {description: Invalid credentials}}
  /auth/logout: {post: {responses: {"200": {description: Logged out}}}}
  /auth/invitations/accept:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
      responses: {"200": {description: Invitation accepted}, "400": {description: Invalid or expired token}}
  /auth/password-resets/complete:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
      responses: {"200": {description: Password reset and sessions revoked}, "400": {description: Invalid or expired token}}
  /identity/users:
    get: {responses: {"200": {description: Persistent account directory}}}
  /identity/invitations:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, global_role_id]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                display_name: {type: string}
                global_role_id: {type: string}
      responses: {"201": {description: User invitation with one-time token}}
  /identity/users/{username}:
    patch:
      parameters: [{$ref: '#/components/parameters/Username'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [ACTIVE, SUSPENDED, DEACTIVATED]}
      responses: {"200": {description: Account status updated}}
  /identity/users/{username}/password-reset:
    post:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: One-time password reset token}}
  /identity/users/{username}/sessions/revoke:
    post:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: Sessions revoked}}
  /identity/roles:
    get: {responses: {"200": {description: Global and Project roles}}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope_type]
              properties:
                name: {type: string}
                scope_type: {type: string, enum: [GLOBAL, PROJECT]}
                description: {type: string}
      responses: {"201": {description: Custom role created}}
  /identity/permissions:
    get: {responses: {"200": {description: Permission registry}}}
  /identity/roles/{role_id}/permissions:
    put:
      parameters: [{$ref: '#/components/parameters/RoleId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: {type: array, items: {type: string}}
      responses: {"200": {description: Role permissions replaced}}
  /identity/users/{username}/role:
    put:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: Global role assigned}}
  /identity/projects/{project_id}/users/{username}/role:
    put:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/Username'}
      responses: {"200": {description: Project role assigned}}
  /identity/audit:
    get: {responses: {"200": {description: Append-only audit events}}}
  /workspace/organizations:
    get: {responses: {"200": {description: Organizations visible to current session}}}
    post:
      responses: {"201": {description: Organization created}}
  /workspace/organizations/{organization_id}:
    patch:
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses: {"200": {description: Organization updated}}
  /workspace/projects:
    get: {responses: {"200": {description: Projects visible to current session}}}
    post:
      responses: {"201": {description: Project created and creator assigned as Project Owner}}
  /workspace/projects/{project_id}:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project detail and Labs}}
    patch:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project updated}}
  /workspace/projects/{project_id}/labs:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project Labs}}
    post:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"201": {description: Lab created}}
  /workspace/labs/{lab_id}:
    patch:
      parameters: [{$ref: '#/components/parameters/LabId'}]
      responses: {"200": {description: Lab updated}}
  /workspace/projects/{project_id}/members:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project memberships}}
    post:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"201": {description: Project membership created}}
  /workspace/projects/{project_id}/members/{username}:
    delete:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/Username'}
      responses: {"200": {description: Project membership revoked}}
  /auth/me: {get: {responses: {"200": {description: Current user}}}}
  /auth/activity: {post: {responses: {"200": {description: Authenticated activity heartbeat}}}}
  /runs:
    get: {responses: {"200": {description: Runs}}}
    post:
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunLaunchRequest'}}}}
      responses: {"202": {description: Process started}}
  /runs/{run_id}: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Run detail}}}}
  /runs/{run_id}/cancel: {post: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"200": {description: Cancelled}}}}
  /runs/{run_id}/retry: {post: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"202": {description: New Run started with source_run_id, process_id, command and status}}}}
  /runs/{run_id}/tests: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Tests}}}}
  /runs/{run_id}/tests/{test_result_id}: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: test_result_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Test detail}}}}
  /tests/{test_id}/metrics: {get: {parameters: [{name: test_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Metric history}}}}
  /runs/{run_id}/network-observability:
    get:
      operationId: getRunNetworkObservability
      summary: Read measured performance, Wi-Fi telemetry, PCAP integrity and protocol evidence
      description: Requires runs.read. Performance samples are independently filtered by performance.read; telemetry, health and packet/protocol evidence are independently filtered by evidence.read. Binary PCAP bytes and local filesystem paths are never included.
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Stable Run-scoped observability response with per-domain access and integrity states}
        "403": {description: Caller lacks runs.read}
        "404": {description: Run not found}
  /runs/{run_id}/metrics: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Metrics}}}}
  /runs/{run_id}/telemetry: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Telemetry}}}}
  /runs/{run_id}/health: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Health}}}}
  /runs/{run_id}/regressions: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: baseline_run_id, in: query, required: true, schema: {type: string}}], responses: {"200": {description: Regression report}}}}
  /runs/{run_id}/release-gate: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: baseline_run_id, in: query, required: true, schema: {type: string}}], responses: {"200": {description: Release gate decision}}}}
  /regressions: {get: {responses: {"200": {description: Regression report}}}}
  /artifacts: {get: {responses: {"200": {description: Artifacts}}}}
  /artifacts/{artifact_id}: {get: {parameters: [{name: artifact_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Artifact}}}}
  /artifacts/{artifact_id}/download: {get: {parameters: [{name: artifact_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Artifact binary}}}}
  /labs/{lab_id}/health: {get: {parameters: [{name: lab_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Lab health}}}}
  /sync/queue: {get: {responses: {"200": {description: Admin-only offline queue status and recent envelopes}}}}
  /waivers:
    get: {responses: {"200": {description: Active waivers; Owner/Admin only}}}
    post:
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, issue_code, reason]
              properties:
                scope: {type: string, enum: [TEST, RUN, REGRESSION, RELEASE]}
                target_id: {type: string}
                issue_code: {type: string}
                reason: {type: string}
                expires_at: {type: string, format: date-time}
      responses:
        "201": {description: Waiver created}
  /baselines:
    get: {responses: {"200": {description: Active baselines}}}
    post: {parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/BaselinePromotionRequest'}}}}, responses: {"201": {description: Baseline promoted}}}
  /baselines/{baseline_id}/promote: {post: {parameters: [{name: baseline_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"201": {description: Baseline promoted}}}}
  /firmware/operations: {post: {parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FirmwareOperationRequest'}}}}, responses: {"202": {description: Firmware operation}}}}
  /firmware/{device_id}/rollback:
    post:
      parameters:
        - {name: device_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, expected_version]
              properties:
                run_id: {type: string, minLength: 1}
                expected_version: {type: string, minLength: 1}
                reason: {type: string, minLength: 1}
      responses:
        "200": {description: Rollback command completed and the target version was independently verified}
        "400": {description: Invalid request or rollback verification failed}

components:
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: {type: string}
    RoleId:
      name: role_id
      in: path
      required: true
      schema: {type: string}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string}
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: {type: string}
    LabId:
      name: lab_id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  securitySchemes:
    sessionAuth: {type: apiKey, in: cookie, name: netregress_session}
  schemas:
    NetworkIntentDefinition:
      type: object
      additionalProperties: false
      required: [schema_version]
      description: >-
        Vendor-neutral Network Intent schema v1.0. No CLI commands, controller IDs,
        rendered configuration or secret values are accepted.
      properties:
        schema_version: {type: string, enum: ["1.0"]}
        targets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [logical_node_id, device_id]
            properties:
              logical_node_id: {type: string, maxLength: 64}
              device_id: {type: string, maxLength: 64}
        segments:
          type: array
          items:
            type: object
            required: [segment_id, name]
            properties:
              segment_id: {type: string, maxLength: 64}
              name: {type: string, maxLength: 120}
              vlan_id: {type: integer, minimum: 1, maximum: 4094}
              ipv4_cidr: {type: string}
              ipv6_cidr: {type: string}
        interfaces:
          type: array
          items:
            type: object
            required: [logical_node_id, name, admin_state, mode]
            properties:
              logical_node_id: {type: string}
              name: {type: string, maxLength: 64}
              admin_state: {type: string, enum: [UP, DOWN]}
              mode: {type: string, enum: [ROUTED, ACCESS, TRUNK]}
              addresses: {type: array, items: {type: string}}
              segment_id: {type: string}
              access_vlan_id: {type: integer, minimum: 1, maximum: 4094}
              native_vlan_id: {type: integer, minimum: 1, maximum: 4094}
              allowed_vlans: {type: array, items: {type: integer, minimum: 1, maximum: 4094}}
        static_routes: {type: array, items: {type: object}}
        ospf: {type: array, items: {type: object}}
        bgp: {type: array, items: {type: object}}
        aggregations: {type: array, items: {type: object}}
        firewall_zones: {type: array, items: {type: object}}
        firewall_rules: {type: array, items: {type: object}}
        service_references: {type: array, items: {type: object, description: Published Project-owned DHCP/DNS configuration profile/revision references only}}
        linux_bridges: {type: array, items: {type: object}}
        linux_vlan_interfaces: {type: array, items: {type: object}}
    LoginRequest:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    RunLaunchRequest:
      type: object
      description: Project and Lab are required for membership-scoped users; wildcard local administrators may omit them for legacy unscoped execution.
      properties:
        firmware_version: {type: string, default: v1.0}
        tests: {type: array, items: {type: string}}
        project_id: {type: string, minLength: 1}
        lab_id: {type: string, minLength: 1}
    BaselinePromotionRequest:
      type: object
      required: [run_id]
      properties: {run_id: {type: string}, name: {type: string}, device_scope: {type: string}, firmware_major_scope: {type: string}, test_suite_version: {type: string}, lab_class: {type: string}}
    FirmwareOperationRequest:
      type: object
      required: [run_id, device_id, image_path, version]
      properties:
        run_id: {type: string, minLength: 1}
        device_id: {type: string, minLength: 1}
        image_path: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        reason: {type: string}
        compatible_models: {type: array, items: {type: string}}
        expected_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        signature_path: {type: string}

