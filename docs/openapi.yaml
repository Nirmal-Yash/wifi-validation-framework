openapi: 3.0.3
info:
  title: NetRegress Runner API
  version: 1.2.0
servers:
  - url: /api/v1
security:
  - sessionAuth: []
paths:
  /topologies/import/packet-tracer:
    post:
      operationId: importPacketTracerProject
      description: >-
        Import a native Cisco Packet Tracer .pkt file into the existing canonical topology domain.
        Original bytes, SHA-256, codec/version, provenance and compatibility report are retained
        immutably. Logical devices are not assigned provider templates and no emulator operation is
        performed. The first native export subset supports name and canvas-coordinate edits only.
        Codec read-back does not certify reopening in the Packet Tracer desktop application.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project_id, name, file]
              properties:
                project_id: {type: string, minLength: 1}
                name: {type: string, minLength: 1, maxLength: 120}
                scope_type: {type: string, enum: [PROJECT, LAB], default: PROJECT}
                scope_id: {type: string, maxLength: 128, description: Required when scope_type is LAB}
                file: {type: string, format: binary, description: Native .pkt file, maximum 3.5 MB}
      responses:
        "201":
          description: Imported canonical DRAFT revision and immutable native source metadata
        "400":
          description: Missing fields or invalid idempotency key
        "403":
          description: Project topology.manage permission required
        "409":
          description: Idempotency key reuse or profile name conflict
        "413":
          description: Upload exceeds configured request or native file size limit
        "422":
          description: Malformed, unsupported or invalid Packet Tracer file
  /topologies/{profile_id}/native-sources:
    get:
      operationId: listTopologyNativeSources
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Immutable native source provenance and conversion reports (source bytes excluded)
        "403":
          description: Project topology.read permission required
        "404":
          description: Topology profile not found
  /topologies/{profile_id}/native-sources/{source_id}/export:
    get:
      operationId: exportPacketTracerRevision
      description: >-
        Export a selected revision against the retained Packet Tracer native source.
        Unmapped semantic edits and link changes are rejected. The response includes an
        X-NetRegress-Export-Report header. Packet Tracer desktop reopening remains an
        external acceptance gate.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string}
        - name: source_id
          in: path
          required: true
          schema: {type: string}
        - name: revision_id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Native Packet Tracer .pkt file
          headers:
            X-NetRegress-Export-Report:
              schema: {type: string}
              description: Base64url-encoded JSON compatibility and codec read-back report
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "403":
          description: Project topology.manage permission required
        "404":
          description: Native source, profile or revision not found
        "409":
          description: Export would lose unsupported topology changes
        "422":
          description: Native source integrity or serialization failure
  /topologies/validate:
    post:
      operationId: validateTopologyDraft
      description: >-
        Validate a visual topology draft against the canonical, read-only Project-scoped topology rules.
        Optional logical node and interface network-intent fields are normalized and hashed with the
        definition. template_id may be empty for an unmapped provider-independent logical node; a
        later provider dry-run blocks unmapped nodes. configuration_profile_id must identify a PUBLISHED profile backed by an ACTIVE schema in the
        same Project. credential_ref_id must identify an ACTIVE Vault record in the same Project. Their read permissions are checked when
        the reference is supplied. credential_ref_id is an opaque Credential Vault reference ID only; never credential material or a
        secret value is accepted or returned. Does not persist a revision or contact a provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, definition]
              properties:
                project_id: {type: string, minLength: 1}
                profile_id: {type: string}
                definition:
                  type: object
                  required: [nodes, links]
                  properties:
                    nodes:
                      type: array
                      maxItems: 128
                      items:
                        type: object
                        required: [id, name, node_type, x, y]
                        properties:
                          id: {type: string, maxLength: 64}
                          name: {type: string, maxLength: 120}
                          node_type: {type: string, enum: [ROUTER, SWITCH, ACCESS_POINT, CLIENT, MONITOR, CLOUD, OTHER]}
                          template_id: {type: string, maxLength: 128, description: Optional provider-specific template mapping; empty means logical-only/unmapped}
                          x: {type: number, minimum: 0, maximum: 10000}
                          y: {type: number, minimum: 0, maximum: 10000}
                          vendor: {type: string, maxLength: 80}
                          operating_system: {type: string, maxLength: 80}
                          image: {type: string, maxLength: 128}
                          cpu_cores: {type: integer, minimum: 1, maximum: 128}
                          memory_mb: {type: integer, minimum: 128, maximum: 1048576}
                          management_address: {type: string, maxLength: 64, description: IPv4/IPv6 address with optional prefix}
                          default_gateway: {type: string, maxLength: 64}
                          vlan_id: {type: integer, minimum: 1, maximum: 4094}
                          configuration_profile_id: {type: string, maxLength: 128}
                          credential_ref_id: {type: string, maxLength: 128, description: Opaque Credential Vault reference ID only; never a secret}
                          properties: {type: object, maxProperties: 32}
                          interfaces:
                            type: array
                            maxItems: 64
                            items:
                              type: object
                              required: [name, adapter, port]
                              properties:
                                name: {type: string, maxLength: 64}
                                adapter: {type: integer, minimum: 0, maximum: 255}
                                port: {type: integer, minimum: 0, maximum: 255}
                                mode: {type: string, enum: [ACCESS, TRUNK, ROUTED, WIRELESS, OTHER]}
                                ip_address: {type: string, maxLength: 64}
                                vlan_id: {type: integer, minimum: 1, maximum: 4094}
                                description: {type: string, maxLength: 160}
                    links:
                      type: array
                      maxItems: 512
                      items:
                        type: object
                        required: [id, source_node_id, source_adapter, source_port, target_node_id, target_adapter, target_port]
                        properties:
                          id: {type: string, maxLength: 64}
                          source_node_id: {type: string, maxLength: 64}
                          source_adapter: {type: integer, minimum: 0, maximum: 255}
                          source_port: {type: integer, minimum: 0, maximum: 255}
                          source_interface_name: {type: string, maxLength: 64}
                          target_node_id: {type: string, maxLength: 64}
                          target_adapter: {type: integer, minimum: 0, maximum: 255}
                          target_port: {type: integer, minimum: 0, maximum: 255}
                          target_interface_name: {type: string, maxLength: 64}
                          link_type: {type: string, enum: [ETHERNET, WIRELESS, SERIAL, TUNNEL, OTHER]}
                          network_segment_id: {type: string, maxLength: 128}
                          vlan_id: {type: integer, minimum: 1, maximum: 4094}
      responses:
        "200": {description: Canonical topology is valid; returns node/link counts and SHA-256}
        "400": {description: Missing Project scope or malformed request}
        "403": {description: Caller lacks topology.manage in this Project}
        "404": {description: Project, selected profile, credential or configuration profile not found in the supplied Project}
        "422": {description: Topology definition, interface or reference state violates canonical constraints}
  /dashboard/operations-overview:
    get:
      summary: Read a Project/Lab operational overview
      operationId: getOperationsOverview
      description: >-
        Read-only aggregation of persisted Project, Lab, device, topology, provider binding,
        configuration deployment, pipeline, Run, evidence and valid performance sample records.
        Requires workspace.read for the Project. Section data is independently redacted by
        devices.read, topology.read, pipelines.read, runs.read, configurations.read,
        evidence.read and performance.read. Does not launch Runs, mutate records, contact
        provider controllers, synthesize telemetry, infer device reachability or infer drift.
        Provider health remains UNKNOWN until an actual health observation is recorded.
      parameters:
        - name: project_id
          in: query
          required: true
          description: Project whose persisted operational records are summarized.
          schema: {type: string, minLength: 1}
        - name: lab_id
          in: query
          required: false
          description: Optional Lab filter owned by project_id; labs.total remains Project-wide.
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Project/Lab operational overview with independent access flags, source provenance, and query/source timestamps
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [observed_at, scope, labs, devices, topology, providers, pipelines, runs, configuration, evidence, performance, network_health, action_items]
                    properties:
                      observed_at: {type: string, format: date-time}
                      scope: {type: object}
                      labs: {type: object}
                      devices: {type: object}
                      topology: {type: object}
                      providers: {type: object}
                      pipelines: {type: object}
                      runs: {type: object}
                      configuration: {type: object}
                      evidence: {type: object}
                      performance: {type: object}
                      network_health: {type: object}
                      action_items: {type: object}
        "400": {description: Missing project_id or invalid request (INVALID_REQUEST)}
        "401": {description: Missing or invalid authenticated session (UNAUTHENTICATED)}
        "403": {description: Caller cannot access the selected Project (FORBIDDEN)}
        "404": {description: Project or Lab not found in the selected Project (NOT_FOUND)}
        "500": {description: Unexpected dashboard query failure}
  /providers/registry:
    get:
      operationId: listProviderRegistry
      summary: List registered provider adapters, capabilities and Project connections
      description: >-
        Read-only local registry discovery scoped by project_id and topology.read.
        Returns registered adapter metadata, declared capabilities and persisted
        Project/Lab connection references. Does not contact a provider controller,
        verify live connectivity or resolve/return Credential Vault secret material.
        Provider operational health remains UNKNOWN until an explicit source observation exists.
      parameters:
        - name: project_id
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {description: Provider descriptors and persisted scoped connection references}
        "400": {description: Missing project_id (INVALID_REQUEST)}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the selected Project}
  /labs/{lab_id}/provider-binding:
    get:
      operationId: getLabProviderBinding
      summary: Read the Project/Lab provider binding
      description: >-
        Returns safe Project/Lab-scoped provider binding metadata. Provider credential
        values are never included. Requires topology.read.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {description: Provider binding metadata or null}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the Lab's Project}
    put:
      operationId: bindLabTopologyProvider
      summary: Verify and persist a private topology-provider binding
      description: >-
        Binds a GNS3, Cisco Modeling Labs or EVE-NG controller Device and Credential Vault
        API credential to a Lab. Provider workspace reachability is verified before binding
        persistence. provider_workspace_id is canonical; gns3_project_id is retained as a
        backwards-compatible GNS3 alias. Credentials are never included in responses.
        Requires topology.provider.manage and Idempotency-Key.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, endpoint_url, provider_workspace_id, controller_device_id, credential_id]
              properties:
                provider_id: {type: string, enum: [gns3, cml, eve-ng]}
                endpoint_url: {type: string, maxLength: 512}
                provider_workspace_id: {type: string, minLength: 1, maxLength: 512}
                gns3_project_id: {type: string, deprecated: true}
                controller_device_id: {type: string, minLength: 1}
                credential_id: {type: string, minLength: 1}
      responses:
        "200": {description: Verified provider binding metadata}
        "400": {description: Invalid provider, workspace or binding request}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.provider.manage in the Lab's Project}
        "404": {description: Lab or selected provider workspace not found}
        "409": {description: Device, credential or provider scope conflict}
    delete:
      operationId: archiveLabTopologyProviderBinding
      summary: Archive a provider binding without deleting provider resources
      description: >-
        Archives the active Project/Lab provider binding and preserves its audit history.
        It does not delete the provider lab, nodes, links or other controller resources.
        Requires topology.provider.manage and Idempotency-Key.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        "200": {description: Archived provider binding metadata}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.provider.manage in the Lab's Project}
        "404": {description: Active provider binding not found}
  /labs/{lab_id}/provider-catalog:
    get:
      operationId: inspectLabProviderCatalog
      summary: Inspect the bound provider project, templates, nodes, links and compute observations
      description: >-
        Performs a bounded, authenticated, read-only observation through the registered
        provider adapter and the Lab's Credential Vault reference. Requires topology.read
        in the Lab's Project. Returns the controller project catalogue, safe template
        metadata, actual node/link inventory, compute connectivity/utilization observations,
        node lifecycle counts and adapter-level packet-capture capability. Image availability
        is returned by the dry-run plan for the templates mapped by its immutable revision.
        No provider resources are created, deleted, started, stopped or rewired.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {description: Actual provider catalogue and current compute resource observations}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the Lab's Project}
        "404": {description: Lab or active provider binding not found}
        "502": {description: Provider catalogue observation failed}
  /labs/{lab_id}/provider-nodes/{provider_node_id}/interfaces:
    get:
      operationId: inspectLabProviderNodeInterfaces
      summary: Inspect actual provider interfaces for an observed node
      description: >-
        Resolves the active Project/Lab binding, opens a read-only provider session
        through the Credential Vault and verifies the provider node exists in the bound
        controller project before returning its actual adapter/port inventory. Requires
        topology.read. Does not create or modify provider resources.
      parameters:
        - name: lab_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: provider_node_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Actual provider interface inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [lab_id, project_id, provider_project_id, provider_node_id, interfaces, observed_at]
                    properties:
                      lab_id: {type: string}
                      project_id: {type: string}
                      provider_project_id: {type: string}
                      provider_node_id: {type: string}
                      observed_at: {type: string, format: date-time}
                      interfaces:
                        type: array
                        items:
                          type: object
                          properties:
                            adapter_number: {type: integer, minimum: 0, maximum: 255}
                            port_number: {type: integer, minimum: 0, maximum: 255}
                            name: {type: string}
                            short_name: {type: string}
                            link_type: {type: string}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the Lab's Project}
        "404": {description: Lab, binding or observed provider node not found}
        "502": {description: Provider interface observation failed}
  /topologies/{profile_id}/plan:
    post:
      operationId: planTopologyProviderApply
      summary: Build a read-only provider topology apply plan
      description: >-
        Requires topology.read for the topology profile's Project and a published immutable
        revision scoped to the selected Lab. Uses the common provider adapter to observe
        provider projects, template catalogue, compute availability, mapped-template image
        availability, actual nodes and links. The plan reports template/compute/image
        compatibility, provider node lifecycle and port conflicts. UNKNOWN observations
        remain explicit and do not become claims of availability. No provider resources
        are mutated; a later apply must re-check live observations and the revision SHA-256
        and require explicit confirmation.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                revision_id: {type: string, minLength: 1}
      responses:
        "200": {description: Dry-run plan, template compatibility and actual provider observations}
        "400": {description: Invalid plan request}
        "401": {description: Missing or expired authenticated session}
        "403": {description: Caller lacks topology.read in the profile's Project}
        "404": {description: Profile, revision or active provider binding not found}
        "409": {description: Provider state conflicts with the published topology}
        "502": {description: Provider observation failed}
  /health: {get: {security: [], responses: {"200": {description: Healthy}}}}
  /readiness: {get: {responses: {"200": {description: Ready}}}}
  /auth/csrf:
    get: {responses: {"200": {description: CSRF token}}}
  /auth/login:
    post:
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {"200": {description: Authenticated}, "401": {description: Invalid credentials}}
  /auth/logout: {post: {responses: {"200": {description: Logged out}}}}
  /auth/invitations/accept:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
      responses: {"200": {description: Invitation accepted}, "400": {description: Invalid or expired token}}
  /auth/password-resets/complete:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
      responses: {"200": {description: Password reset and sessions revoked}, "400": {description: Invalid or expired token}}
  /identity/users:
    get: {responses: {"200": {description: Persistent account directory}}}
  /identity/invitations:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, global_role_id]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                display_name: {type: string}
                global_role_id: {type: string}
      responses: {"201": {description: User invitation with one-time token}}
  /identity/users/{username}:
    patch:
      parameters: [{$ref: '#/components/parameters/Username'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [ACTIVE, SUSPENDED, DEACTIVATED]}
      responses: {"200": {description: Account status updated}}
  /identity/users/{username}/password-reset:
    post:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: One-time password reset token}}
  /identity/users/{username}/sessions/revoke:
    post:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: Sessions revoked}}
  /identity/roles:
    get: {responses: {"200": {description: Global and Project roles}}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope_type]
              properties:
                name: {type: string}
                scope_type: {type: string, enum: [GLOBAL, PROJECT]}
                description: {type: string}
      responses: {"201": {description: Custom role created}}
  /identity/permissions:
    get: {responses: {"200": {description: Permission registry}}}
  /identity/roles/{role_id}/permissions:
    put:
      parameters: [{$ref: '#/components/parameters/RoleId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: {type: array, items: {type: string}}
      responses: {"200": {description: Role permissions replaced}}
  /identity/users/{username}/role:
    put:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: Global role assigned}}
  /identity/projects/{project_id}/users/{username}/role:
    put:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/Username'}
      responses: {"200": {description: Project role assigned}}
  /identity/audit:
    get: {responses: {"200": {description: Append-only audit events}}}
  /workspace/organizations:
    get: {responses: {"200": {description: Organizations visible to current session}}}
    post:
      responses: {"201": {description: Organization created}}
  /workspace/organizations/{organization_id}:
    patch:
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses: {"200": {description: Organization updated}}
  /workspace/projects:
    get: {responses: {"200": {description: Projects visible to current session}}}
    post:
      responses: {"201": {description: Project created and creator assigned as Project Owner}}
  /workspace/projects/{project_id}:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project detail and Labs}}
    patch:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project updated}}
  /workspace/projects/{project_id}/labs:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project Labs}}
    post:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"201": {description: Lab created}}
  /workspace/labs/{lab_id}:
    patch:
      parameters: [{$ref: '#/components/parameters/LabId'}]
      responses: {"200": {description: Lab updated}}
  /workspace/projects/{project_id}/members:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project memberships}}
    post:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"201": {description: Project membership created}}
  /workspace/projects/{project_id}/members/{username}:
    delete:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/Username'}
      responses: {"200": {description: Project membership revoked}}
  /auth/me: {get: {responses: {"200": {description: Current user}}}}
  /auth/activity: {post: {responses: {"200": {description: Authenticated activity heartbeat}}}}
  /runs:
    get: {responses: {"200": {description: Runs}}}
    post:
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunLaunchRequest'}}}}
      responses: {"202": {description: Process started}}
  /runs/{run_id}: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Run detail}}}}
  /runs/{run_id}/cancel: {post: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"200": {description: Cancelled}}}}
  /runs/{run_id}/retry: {post: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"202": {description: New Run started with source_run_id, process_id, command and status}}}}
  /runs/{run_id}/tests: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Tests}}}}
  /runs/{run_id}/tests/{test_result_id}: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: test_result_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Test detail}}}}
  /tests/{test_id}/metrics: {get: {parameters: [{name: test_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Metric history}}}}
  /runs/{run_id}/metrics: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Metrics}}}}
  /runs/{run_id}/telemetry: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Telemetry}}}}
  /runs/{run_id}/health: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Health}}}}
  /runs/{run_id}/regressions: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: baseline_run_id, in: query, required: true, schema: {type: string}}], responses: {"200": {description: Regression report}}}}
  /runs/{run_id}/release-gate: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: baseline_run_id, in: query, required: true, schema: {type: string}}], responses: {"200": {description: Release gate decision}}}}
  /regressions: {get: {responses: {"200": {description: Regression report}}}}
  /artifacts: {get: {responses: {"200": {description: Artifacts}}}}
  /artifacts/{artifact_id}: {get: {parameters: [{name: artifact_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Artifact}}}}
  /artifacts/{artifact_id}/download: {get: {parameters: [{name: artifact_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Artifact binary}}}}
  /labs/{lab_id}/health: {get: {parameters: [{name: lab_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Lab health}}}}
  /sync/queue: {get: {responses: {"200": {description: Admin-only offline queue status and recent envelopes}}}}
  /waivers:
    get: {responses: {"200": {description: Active waivers; Owner/Admin only}}}
    post:
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, issue_code, reason]
              properties:
                scope: {type: string, enum: [TEST, RUN, REGRESSION, RELEASE]}
                target_id: {type: string}
                issue_code: {type: string}
                reason: {type: string}
                expires_at: {type: string, format: date-time}
      responses:
        "201": {description: Waiver created}
  /baselines:
    get: {responses: {"200": {description: Active baselines}}}
    post: {parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/BaselinePromotionRequest'}}}}, responses: {"201": {description: Baseline promoted}}}
  /baselines/{baseline_id}/promote: {post: {parameters: [{name: baseline_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"201": {description: Baseline promoted}}}}
  /firmware/operations: {post: {parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FirmwareOperationRequest'}}}}, responses: {"202": {description: Firmware operation}}}}
  /firmware/{device_id}/rollback:
    post:
      parameters:
        - {name: device_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, expected_version]
              properties:
                run_id: {type: string, minLength: 1}
                expected_version: {type: string, minLength: 1}
                reason: {type: string, minLength: 1}
      responses:
        "200": {description: Rollback command completed and the target version was independently verified}
        "400": {description: Invalid request or rollback verification failed}
components:
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: {type: string}
    RoleId:
      name: role_id
      in: path
      required: true
      schema: {type: string}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string}
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: {type: string}
    LabId:
      name: lab_id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  securitySchemes:
    sessionAuth: {type: apiKey, in: cookie, name: netregress_session}
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    RunLaunchRequest:
      type: object
      description: Project and Lab are required for membership-scoped users; wildcard local administrators may omit them for legacy unscoped execution.
      properties:
        firmware_version: {type: string, default: v1.0}
        tests: {type: array, items: {type: string}}
        project_id: {type: string, minLength: 1}
        lab_id: {type: string, minLength: 1}
    BaselinePromotionRequest:
      type: object
      required: [run_id]
      properties: {run_id: {type: string}, name: {type: string}, device_scope: {type: string}, firmware_major_scope: {type: string}, test_suite_version: {type: string}, lab_class: {type: string}}
    FirmwareOperationRequest:
      type: object
      required: [run_id, device_id, image_path, version]
      properties:
        run_id: {type: string, minLength: 1}
        device_id: {type: string, minLength: 1}
        image_path: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        reason: {type: string}
        compatible_models: {type: array, items: {type: string}}
        expected_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        signature_path: {type: string}
