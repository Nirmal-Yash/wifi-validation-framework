openapi: 3.0.3
info:
  title: NetRegress Runner API
  version: 1.2.0
servers:
  - url: /api/v1
security:
  - sessionAuth: []
paths:
  /health: {get: {security: [], responses: {"200": {description: Healthy}}}}
  /readiness: {get: {responses: {"200": {description: Ready}}}}
  /auth/csrf:
    get: {responses: {"200": {description: CSRF token}}}
  /auth/login:
    post:
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {"200": {description: Authenticated}, "401": {description: Invalid credentials}}
  /auth/logout: {post: {responses: {"200": {description: Logged out}}}}
  /auth/invitations/accept:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
      responses: {"200": {description: Invitation accepted}, "400": {description: Invalid or expired token}}
  /auth/password-resets/complete:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
      responses: {"200": {description: Password reset and sessions revoked}, "400": {description: Invalid or expired token}}
  /identity/users:
    get: {responses: {"200": {description: Persistent account directory}}}
  /identity/invitations:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, global_role_id]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                display_name: {type: string}
                global_role_id: {type: string}
      responses: {"201": {description: User invitation with one-time token}}
  /identity/users/{username}:
    patch:
      parameters: [{$ref: '#/components/parameters/Username'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [ACTIVE, SUSPENDED, DEACTIVATED]}
      responses: {"200": {description: Account status updated}}
  /identity/users/{username}/password-reset:
    post:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: One-time password reset token}}
  /identity/users/{username}/sessions/revoke:
    post:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: Sessions revoked}}
  /identity/roles:
    get: {responses: {"200": {description: Global and Project roles}}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope_type]
              properties:
                name: {type: string}
                scope_type: {type: string, enum: [GLOBAL, PROJECT]}
                description: {type: string}
      responses: {"201": {description: Custom role created}}
  /identity/permissions:
    get: {responses: {"200": {description: Permission registry}}}
  /identity/roles/{role_id}/permissions:
    put:
      parameters: [{$ref: '#/components/parameters/RoleId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: {type: array, items: {type: string}}
      responses: {"200": {description: Role permissions replaced}}
  /identity/users/{username}/role:
    put:
      parameters: [{$ref: '#/components/parameters/Username'}]
      responses: {"200": {description: Global role assigned}}
  /identity/projects/{project_id}/users/{username}/role:
    put:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/Username'}
      responses: {"200": {description: Project role assigned}}
  /identity/audit:
    get: {responses: {"200": {description: Append-only audit events}}}
  /workspace/organizations:
    get: {responses: {"200": {description: Organizations visible to current session}}}
    post:
      responses: {"201": {description: Organization created}}
  /workspace/organizations/{organization_id}:
    patch:
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses: {"200": {description: Organization updated}}
  /workspace/projects:
    get: {responses: {"200": {description: Projects visible to current session}}}
    post:
      responses: {"201": {description: Project created and creator assigned as Project Owner}}
  /workspace/projects/{project_id}:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project detail and Labs}}
    patch:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project updated}}
  /workspace/projects/{project_id}/labs:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project Labs}}
    post:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"201": {description: Lab created}}
  /workspace/labs/{lab_id}:
    patch:
      parameters: [{$ref: '#/components/parameters/LabId'}]
      responses: {"200": {description: Lab updated}}
  /workspace/projects/{project_id}/members:
    get:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"200": {description: Project memberships}}
    post:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {"201": {description: Project membership created}}
  /workspace/projects/{project_id}/members/{username}:
    delete:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/Username'}
      responses: {"200": {description: Project membership revoked}}
  /auth/me: {get: {responses: {"200": {description: Current user}}}}
  /auth/activity: {post: {responses: {"200": {description: Authenticated activity heartbeat}}}}
  /runs:
    get: {responses: {"200": {description: Runs}}}
    post:
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunLaunchRequest'}}}}
      responses: {"202": {description: Process started}}
  /runs/{run_id}: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Run detail}}}}
  /runs/{run_id}/cancel: {post: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"200": {description: Cancelled}}}}
  /runs/{run_id}/retry: {post: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"202": {description: New Run started with source_run_id, process_id, command and status}}}}
  /runs/{run_id}/tests: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Tests}}}}
  /runs/{run_id}/tests/{test_result_id}: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: test_result_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Test detail}}}}
  /tests/{test_id}/metrics: {get: {parameters: [{name: test_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Metric history}}}}
  /runs/{run_id}/metrics: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Metrics}}}}
  /runs/{run_id}/telemetry: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Telemetry}}}}
  /runs/{run_id}/health: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Health}}}}
  /runs/{run_id}/regressions: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: baseline_run_id, in: query, required: true, schema: {type: string}}], responses: {"200": {description: Regression report}}}}
  /runs/{run_id}/release-gate: {get: {parameters: [{name: run_id, in: path, required: true, schema: {type: string}}, {name: baseline_run_id, in: query, required: true, schema: {type: string}}], responses: {"200": {description: Release gate decision}}}}
  /regressions: {get: {responses: {"200": {description: Regression report}}}}
  /artifacts: {get: {responses: {"200": {description: Artifacts}}}}
  /artifacts/{artifact_id}: {get: {parameters: [{name: artifact_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Artifact}}}}
  /artifacts/{artifact_id}/download: {get: {parameters: [{name: artifact_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Artifact binary}}}}
  /labs/{lab_id}/health: {get: {parameters: [{name: lab_id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Lab health}}}}
  /sync/queue: {get: {responses: {"200": {description: Admin-only offline queue status and recent envelopes}}}}
  /waivers:
    get: {responses: {"200": {description: Active waivers; Owner/Admin only}}}
    post:
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, issue_code, reason]
              properties:
                scope: {type: string, enum: [TEST, RUN, REGRESSION, RELEASE]}
                target_id: {type: string}
                issue_code: {type: string}
                reason: {type: string}
                expires_at: {type: string, format: date-time}
      responses:
        "201": {description: Waiver created}
  /baselines:
    get: {responses: {"200": {description: Active baselines}}}
    post: {parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/BaselinePromotionRequest'}}}}, responses: {"201": {description: Baseline promoted}}}
  /baselines/{baseline_id}/promote: {post: {parameters: [{name: baseline_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {"201": {description: Baseline promoted}}}}
  /firmware/operations: {post: {parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FirmwareOperationRequest'}}}}, responses: {"202": {description: Firmware operation}}}}
  /firmware/{device_id}/rollback:
    post:
      parameters:
        - {name: device_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, expected_version]
              properties:
                run_id: {type: string, minLength: 1}
                expected_version: {type: string, minLength: 1}
                reason: {type: string, minLength: 1}
      responses:
        "200": {description: Rollback command completed and the target version was independently verified}
        "400": {description: Invalid request or rollback verification failed}
components:
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: {type: string}
    RoleId:
      name: role_id
      in: path
      required: true
      schema: {type: string}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string}
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: {type: string}
    LabId:
      name: lab_id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  securitySchemes:
    sessionAuth: {type: apiKey, in: cookie, name: netregress_session}
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    RunLaunchRequest:
      type: object
      properties: {firmware_version: {type: string, default: v1.0}, tests: {type: array, items: {type: string}}}
    BaselinePromotionRequest:
      type: object
      required: [run_id]
      properties: {run_id: {type: string}, name: {type: string}, device_scope: {type: string}, firmware_major_scope: {type: string}, test_suite_version: {type: string}, lab_class: {type: string}}
    FirmwareOperationRequest:
      type: object
      required: [run_id, device_id, image_path, version]
      properties:
        run_id: {type: string, minLength: 1}
        device_id: {type: string, minLength: 1}
        image_path: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        reason: {type: string}
        compatible_models: {type: array, items: {type: string}}
        expected_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        signature_path: {type: string}
