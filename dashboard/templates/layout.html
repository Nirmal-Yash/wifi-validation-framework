<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}NetRegress Dashboard{% endblock %}</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0}
header{background:#0f172a;color:#fff;padding:18px 28px}header h1{margin:0;font-size:1.2rem}header p{margin:4px 0 0;color:#cbd5e1;font-size:.85rem}
nav{display:flex;gap:16px;flex-wrap:wrap;background:#fff;padding:12px 28px;border-bottom:1px solid #e2e8f0}nav a{color:#334155;text-decoration:none;font-weight:600}
main{max-width:1400px;margin:0 auto;padding:24px 28px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px}.stat strong{display:block;font-size:1.35rem}.small{font-size:.82rem;color:#64748b}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f8fafc;color:#475569;font-size:.78rem;text-transform:uppercase}pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:.75rem;font-weight:700;background:#e2e8f0}.pass{background:#dcfce7;color:#166534}.fail,.regression{background:#fee2e2;color:#991b1b}.warning,.soft{background:#ffedd5;color:#9a3412}.unvalidated{background:#fef3c7;color:#92400e}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.control{display:flex;flex-direction:column;gap:4px}.control label{font-size:.78rem;font-weight:700;color:#475569}
button,input,select{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;background:#fff}button{cursor:pointer}.notice{padding:10px 12px;border-radius:8px;background:#eff6ff;color:#1e40af}.notice.warn{background:#fff7ed;color:#9a3412}
@media(max-width:700px){main{padding:16px}nav{padding:10px 16px}}
</style></head><body>
<header><h1>NetRegress Validation Dashboard</h1><p>Evidence-driven WiFi validation — read-only operational view</p></header>
<nav><a href="/">Home</a><a href="/runs">Runs</a><a href="/regressions">Regressions</a><a href="/performance">Performance</a><a href="/telemetry">Telemetry</a><a href="/lab-health">Lab Health</a><a href="/artifacts">Artifacts</a></nav>
<main>{% block content %}{% endblock %}</main></body></html>
