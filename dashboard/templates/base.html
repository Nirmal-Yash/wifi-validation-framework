<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}NetForge{% endblock %}</title><link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">{% block extra_head %}{% endblock %}<style>:root{--background:#131313;--surface:#1f1f1f;--surface-highest:#353535;--sidebar-bg:#0e0e0e;--on-surface:#e2e2e2;--on-surface-muted:#aba9a9;--primary:#ffb77d;--primary-container:#ff8c00;--on-primary-container:#271400;--error:#ffb4ab;--border:#353535;--sidebar-width:250px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--background);color:var(--on-surface);font-family:'JetBrains Mono',monospace}body{display:flex;height:100vh;overflow:hidden;font-size:14px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.sidebar{width:var(--sidebar-width);background:var(--sidebar-bg);border-right:1px solid var(--border);padding:18px 0;display:flex;flex-direction:column;flex-shrink:0;z-index:100;transition:width .22s ease,transform .22s ease;overflow:hidden}.sidebar.collapsed{width:58px}.sidebar-brand{height:50px;padding:0 18px;border-bottom:1px solid var(--primary-container);font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--primary-container);margin-bottom:12px;display:flex;align-items:center;gap:10px;white-space:nowrap}.sidebar.collapsed .sidebar-brand span,.sidebar.collapsed .sidebar-link span{display:none}.sidebar-toggle{margin:0 10px 10px;width:calc(100% - 20px);height:34px;background:#151515;color:var(--primary);border:1px solid var(--border);text-align:left;padding:0 10px}.sidebar.collapsed .sidebar-toggle{text-align:center}.sidebar-link{padding:12px 18px;color:var(--on-surface-muted);text-decoration:none;font-family:'Courier Prime',monospace;font-size:12px;text-transform:uppercase;font-weight:700;border-left:2px solid transparent;display:flex;align-items:center;gap:10px;white-space:nowrap;transition:color .18s,background .18s,border-color .18s}.sidebar-link:hover,.sidebar-link.active{background:rgba(255,140,0,.06);border-left-color:var(--primary-container);color:var(--primary)}.main-content{flex:1;min-width:0;padding:28px;display:flex;flex-direction:column;height:100vh;overflow-y:auto;position:relative;transition:padding .22s ease}body.nav-collapsed .main-content{padding-left:20px;padding-right:20px}h1,h2,h3{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:-.01em;color:var(--on-surface);margin-top:0}.panel{background:var(--surface);border:1px solid var(--border);border-top:1px solid var(--primary-container);padding:20px;margin-bottom:18px}.btn{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:8px 15px;font-family:'Courier Prime',monospace;text-transform:uppercase;font-weight:700;font-size:12px;transition:all .16s}.btn:hover,.btn.primary{background:var(--primary-container);color:var(--on-primary-container);border-color:var(--primary-container);box-shadow:0 0 8px rgba(255,140,0,.25)}.btn:focus-visible,.sidebar-link:focus-visible,.sidebar-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:2px}.btn-danger{border-color:var(--error);color:var(--error)}.btn-danger:hover{background:var(--error);color:#000}.muted{color:var(--on-surface-muted)}code,pre{font-family:'JetBrains Mono',monospace}pre{white-space:pre-wrap;overflow:auto}@media(max-width:800px){body{overflow:auto}.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:20px 0 60px #000}.sidebar.mobile-open{transform:translateX(0)}.sidebar.collapsed{width:250px}.sidebar.collapsed .sidebar-brand span,.sidebar.collapsed .sidebar-link span{display:inline}.main-content{min-height:100vh;height:auto;padding:18px}.mobile-nav{display:block!important}}.mobile-nav{display:none;position:fixed;left:12px;top:12px;z-index:110;background:#151515;color:var(--primary);border:1px solid var(--primary);padding:7px 10px}</style></head><body><button class="mobile-nav" id="mobileNav" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button><nav class="sidebar" id="sidebar" aria-label="Primary navigation"><div class="sidebar-brand"><i class="fa-solid fa-satellite-dish"></i><span>NETFORGE</span></div><button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse navigation" aria-expanded="true"><i class="fa-solid fa-angles-left"></i><span> Minimize</span></button><a href="/" class="sidebar-link"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a><a href="/operations" class="sidebar-link"><i class="fa-solid fa-play"></i><span>Operations</span></a><a href="/analytics" class="sidebar-link"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></a><a href="/topology" class="sidebar-link"><i class="fa-solid fa-network-wired"></i><span>Topology</span></a><a href="/history" class="sidebar-link"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a><a href="/admin" class="sidebar-link"><i class="fa-solid fa-shield-halved"></i><span>Admin</span></a><a href="/about" class="sidebar-link"><i class="fa-solid fa-server"></i><span>System</span></a>{% if session.get('username') %}<form method="post" action="/logout" style="margin-top:auto"><input type="hidden" name="csrf" value="{{ session.get('csrf','')|e }}"><button type="submit" class="sidebar-link" style="width:100%;background:transparent;border-top:0;border-right:0;border-bottom:0;text-align:left"><i class="fa-solid fa-right-from-bracket"></i><span>Logout ({{session.get('username')}})</span></button></form>{% else %}<a href="/signin" class="sidebar-link" style="margin-top:auto"><i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span></a><a href="/signup" class="sidebar-link"><i class="fa-solid fa-user-plus"></i><span>Sign Up</span></a>{% endif %}</nav><div class="main-content">{% block content %}{% endblock %}</div><script>(()=>{const nav=document.getElementById('sidebar'),toggle=document.getElementById('sidebarToggle'),mobile=document.getElementById('mobileNav');if(!nav||!toggle)return;const sync=()=>{const c=nav.classList.contains('collapsed');document.body.classList.toggle('nav-collapsed',c);toggle.innerHTML=c?'<i class="fa-solid fa-angles-right"></i>':'<i class="fa-solid fa-angles-left"></i><span> Minimize</span>';toggle.setAttribute('aria-expanded',String(!c));localStorage.setItem('netforge.navCollapsed',c?'1':'0')};if(localStorage.getItem('netforge.navCollapsed')==='1')nav.classList.add('collapsed');sync();toggle.addEventListener('click',()=>{nav.classList.toggle('collapsed');sync()});mobile?.addEventListener('click',()=>nav.classList.toggle('mobile-open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')nav.classList.remove('mobile-open')})})();</script></body></html>
