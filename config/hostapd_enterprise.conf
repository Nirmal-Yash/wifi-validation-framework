interface=wlan0
ssid=StyleFusion_Enterprise
driver=nl80211
hw_mode=g
channel=6

# Enterprise 802.1X Security Layer
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP

# Built-in EAP Server Configuration
ieee8021x=1
eap_server=1
eap_user_file=config/hostapd.eap_user
server_cert=config/certs/server.pem
private_key=config/certs/server.key
